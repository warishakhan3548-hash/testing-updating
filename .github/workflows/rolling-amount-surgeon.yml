name: Rolling Amount Surgeon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rolling-amount-surgeon.yml"

permissions:
  contents: write

jobs:
  surgery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify surgical baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object lib/main.dart)" = "6547fa0393a011224f20b820fcb81e17397741c6"
          test "$(git hash-object test/ui_micro_aesthetics_test.dart)" = "3babd603f1fbc13d68b0561af9d70b970433982a"

      - name: Apply verified premium motion patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/rolling-ui.patch
          test "$(sha256sum /tmp/rolling-ui.patch | awk '{print $1}')" = "d55c61939d0181108781ef7989630060e03525a78c91d1d76a8accd3658436a3"
          git apply --check /tmp/rolling-ui.patch
          git apply /tmp/rolling-ui.patch
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format surgical scope
        run: dart format lib/main.dart test/ui_micro_aesthetics_test.dart

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Verify exact change scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t files < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${files[*]}"
          test "${#files[@]}" -eq 2
          printf '%s\n' "${files[@]}" | grep -Fx 'lib/main.dart'
          printf '%s\n' "${files[@]}" | grep -Fx 'test/ui_micro_aesthetics_test.dart'
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Commit and push verified upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart test/ui_micro_aesthetics_test.dart
          git commit -m "Add retargetable rolling ledger amounts"
          git push origin HEAD:main
