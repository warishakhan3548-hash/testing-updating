name: App-wide Core Ripple Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/appwide-ripple-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch core interaction ripple only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/main.dart')
          s = p.read_text()

          # 1) Remove the one-off Expense-only ripple widget.
          start_marker = "class _ExpenseShareRippleAction extends StatefulWidget {"
          end_marker = "class ExpenseScreen extends StatefulWidget {"
          start = s.find(start_marker)
          end = s.find(end_marker, start if start >= 0 else 0)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Expense-specific ripple widget block not found')
          s = s[:start] + s[end:]

          # 2) Restore Expense Share to the normal shared action primitive.
          old_expense = """            _ExpenseShareRippleAction(\n              onTap: () => unawaited(_shareCurrentMonthExpenses()),\n            ),"""
          new_expense = """            _CircleAction(\n              icon: Icons.share_rounded,\n              color: appleBlue,\n              semanticLabel: 'Share this month expenses',\n              onTap: () => unawaited(_shareCurrentMonthExpenses()),\n            ),"""
          if s.count(old_expense) != 1:
              raise SystemExit(f'Expected one Expense ripple action, found {s.count(old_expense)}')
          s = s.replace(old_expense, new_expense, 1)

          # 3) One canonical 200ms duration for all core tap ripples.
          duration_anchor = "  static const Duration pressOut = Duration(milliseconds: 210);\n"
          duration_new = duration_anchor + "  static const Duration tapRipple = Duration(milliseconds: 200);\n"
          if 'tapRipple = Duration(milliseconds: 200)' not in s:
              if s.count(duration_anchor) != 1:
                  raise SystemExit('pressOut duration anchor not found exactly once')
              s = s.replace(duration_anchor, duration_new, 1)

          # 4) Give _Pressable a second lightweight ticker dedicated to ripple.
          old_mixin = """class _PressableState extends State<_Pressable>\n    with SingleTickerProviderStateMixin {"""
          new_mixin = """class _PressableState extends State<_Pressable>\n    with TickerProviderStateMixin {"""
          if s.count(old_mixin) != 1:
              raise SystemExit(f'_Pressable mixin anchor count={s.count(old_mixin)}')
          s = s.replace(old_mixin, new_mixin, 1)

          declaration_anchor = "  late final AnimationController _pressController;\n  Alignment _touchAlignment = Alignment.center;\n"
          declaration_new = "  late final AnimationController _pressController;\n  late final AnimationController _rippleController;\n  Alignment _touchAlignment = Alignment.center;\n"
          if s.count(declaration_anchor) != 1:
              raise SystemExit('Press controller declaration anchor not found')
          s = s.replace(declaration_anchor, declaration_new, 1)

          init_anchor = """    _pressController = AnimationController(\n      vsync: this,\n      value: 0,\n      lowerBound: -.18,\n      upperBound: 1,\n      duration: UIConstants.pressIn,\n      reverseDuration: UIConstants.pressOut,\n    );\n"""
          init_new = init_anchor + """    _rippleController = AnimationController(\n      vsync: this,\n      duration: UIConstants.tapRipple,\n    );\n"""
          if s.count(init_anchor) != 1:
              raise SystemExit('Press controller init anchor not found')
          s = s.replace(init_anchor, init_new, 1)

          disable_anchor = """      _pressController.stop();\n      _pressController.value = 0;\n"""
          disable_new = """      _pressController.stop();\n      _pressController.value = 0;\n      _rippleController.stop();\n      _rippleController.value = 0;\n"""
          if s.count(disable_anchor) != 1:
              raise SystemExit('Press disable anchor not found')
          s = s.replace(disable_anchor, disable_new, 1)

          # 5) Start ripple for every enabled _Pressable tap, even where press
          # compression is intentionally disabled (e.g. route-opening cards).
          old_press = """  void _press([TapDownDetails? details]) {\n    if (widget.onTap == null || !widget.animatePress) return;\n    if (details != null) _captureTouch(details);\n    _pressController.animateTo(\n      1,\n      duration: UIConstants.pressIn,\n      curve: Curves.easeOutCubic,\n    );\n  }\n"""
          new_press = """  void _press([TapDownDetails? details]) {\n    if (widget.onTap == null) return;\n    if (details != null) {\n      _captureTouch(details);\n      if (!AppMotion.reduce(context)) _rippleController.forward(from: 0);\n    }\n    if (!widget.animatePress) return;\n    _pressController.animateTo(\n      1,\n      duration: UIConstants.pressIn,\n      curve: Curves.easeOutCubic,\n    );\n  }\n"""
          if s.count(old_press) != 1:
              raise SystemExit('Old _press implementation not found')
          s = s.replace(old_press, new_press, 1)

          dispose_anchor = """  void dispose() {\n    _pressController.dispose();\n    super.dispose();\n  }\n"""
          dispose_new = """  void dispose() {\n    _pressController.dispose();\n    _rippleController.dispose();\n    super.dispose();\n  }\n"""
          if s.count(dispose_anchor) != 1:
              raise SystemExit('Pressable dispose anchor not found')
          s = s.replace(dispose_anchor, dispose_new, 1)

          old_tap_down = "      onTapDown: widget.onTap == null || !widget.animatePress ? null : _press,\n"
          new_tap_down = "      onTapDown: widget.onTap == null ? null : _press,\n"
          if s.count(old_tap_down) != 1:
              raise SystemExit('Pressable onTapDown anchor not found')
          s = s.replace(old_tap_down, new_tap_down, 1)

          old_anim = """      child: AnimatedBuilder(\n        animation: _pressController,\n        child: widget.child,\n"""
          new_anim = """      child: AnimatedBuilder(\n        animation: Listenable.merge(<Listenable>[\n          _pressController,\n          _rippleController,\n        ]),\n        child: widget.child,\n"""
          if s.count(old_anim) != 1:
              raise SystemExit('Pressable AnimatedBuilder anchor not found')
          s = s.replace(old_anim, new_anim, 1)

          pressed_anchor = """          final double pressed = feedback.clamp(0.0, 1.0).toDouble();\n          final double motion = reduceMotion ? 0 : feedback;\n"""
          pressed_new = """          final double pressed = feedback.clamp(0.0, 1.0).toDouble();\n          final double rippleProgress = reduceMotion ? 0 : _rippleController.value;\n          final double rippleWave = Curves.easeOutCubic.transform(\n            rippleProgress.clamp(0.0, 1.0).toDouble(),\n          );\n          final double rippleFade = (1 - rippleProgress)\n              .clamp(0.0, 1.0)\n              .toDouble();\n          final Color rippleColor =\n              widget.feedbackColor ?? Theme.of(context).colorScheme.primary;\n          final double motion = reduceMotion ? 0 : feedback;\n"""
          if s.count(pressed_anchor) != 1:
              raise SystemExit('Pressable feedback variable anchor not found')
          s = s.replace(pressed_anchor, pressed_new, 1)

          # 6) Draw a clipped water-pulse ring from the exact touch point.
          ripple_insert_anchor = """                            if (widget.feedbackColor != null)\n                              DecoratedBox(\n"""
          ripple_block = """                            if (rippleProgress > 0 && rippleProgress < 1)\n                              DecoratedBox(\n                                decoration: BoxDecoration(\n                                  gradient: RadialGradient(\n                                    center: _touchAlignment,\n                                    radius: .16 + rippleWave * 1.08,\n                                    colors: <Color>[\n                                      rippleColor.withAlpha(\n                                        (rippleFade * (dark ? 16 : 12)).round(),\n                                      ),\n                                      Colors.transparent,\n                                      rippleColor.withAlpha(\n                                        (rippleFade * (dark ? 82 : 64)).round(),\n                                      ),\n                                      Colors.transparent,\n                                    ],\n                                    stops: const <double>[0, .38, .66, 1],\n                                  ),\n                                ),\n                              ),\n""" + ripple_insert_anchor
          if s.count(ripple_insert_anchor) != 1:
              raise SystemExit(f'Ripple insert anchor count={s.count(ripple_insert_anchor)}')
          s = s.replace(ripple_insert_anchor, ripple_block, 1)

          # 7) Shared components expose their own hue to the core ripple.
          circle_anchor = """      child: _Pressable(\n        onTap: onTap,\n        semanticLabel: semanticLabel,\n        borderRadius: BorderRadius.circular(24),\n"""
          circle_new = """      child: _Pressable(\n        onTap: onTap,\n        semanticLabel: semanticLabel,\n        borderRadius: BorderRadius.circular(24),\n        feedbackColor: color,\n"""
          if s.count(circle_anchor) != 1:
              raise SystemExit('CircleAction Pressable anchor not found')
          s = s.replace(circle_anchor, circle_new, 1)

          delete_anchor = """      child: _Pressable(\n        onTap: onTap,\n        semanticLabel: semanticLabel,\n        borderRadius: radius,\n"""
          delete_new = """      child: _Pressable(\n        onTap: onTap,\n        semanticLabel: semanticLabel,\n        borderRadius: radius,\n        feedbackColor: appleRed,\n"""
          if s.count(delete_anchor) != 1:
              raise SystemExit('DeleteAction Pressable anchor not found')
          s = s.replace(delete_anchor, delete_new, 1)

          primary_anchor = """  Widget build(BuildContext context) => _Pressable(\n    onTap: onTap,\n    borderRadius: BorderRadius.circular(UIConstants.actionRadius),\n"""
          primary_new = """  Widget build(BuildContext context) => _Pressable(\n    onTap: onTap,\n    borderRadius: BorderRadius.circular(UIConstants.actionRadius),\n    feedbackColor: color,\n"""
          if s.count(primary_anchor) != 1:
              raise SystemExit(f'PrimaryButton Pressable anchor count={s.count(primary_anchor)}')
          s = s.replace(primary_anchor, primary_new, 1)

          p.write_text(s)
          PY
          git diff --check
          git diff -- lib/main.dart

      - name: Commit core ripple change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "ui: move 200ms ripple into core pressable"
          git push origin HEAD:main
