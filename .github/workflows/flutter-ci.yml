name: One-shot Reference UI Upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch_reference_ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply screenshot-matched UI patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')

          def replace_exact(old: str, new: str, expected: int = 1, label: str = ''):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label or old[:60]}: expected {expected} match(es), found {count}')
              text = text.replace(old, new)

          def patch_section(start_marker: str, end_marker: str, replacements, label: str):
              global text
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              chunk = text[start:end]
              for old, new, expected in replacements:
                  count = chunk.count(old)
                  if count != expected:
                      raise SystemExit(f'{label}: expected {expected} match(es) for {old!r}, found {count}')
                  chunk = chunk.replace(old, new)
              text = text[:start] + chunk + text[end:]

          replace_exact(
              "const Color lightCanvas = Color(0xFFF5F5F7);",
              "const Color lightCanvas = Color(0xFFF8FBFF);",
              label='light canvas',
          )

          replace_exact(
              """const List<_TabSpec> _tabs = <_TabSpec>[
  _TabSpec('Home', Icons.home_rounded, appleBlue),
  _TabSpec('Milk', Icons.local_drink_rounded, appleBlue),
  _TabSpec('Credit', Icons.volunteer_activism_rounded, appleBlue),
  _TabSpec('Expenses', Icons.receipt_long_rounded, semanticRed),
  _TabSpec('Salary', Icons.payments_rounded, appleBlue),
  _TabSpec('Diary', Icons.menu_book_rounded, diaryOrange),
  _TabSpec('Business', Icons.work_rounded, appleBlue),
];""",
              """const List<_TabSpec> _tabs = <_TabSpec>[
  _TabSpec('Home', Icons.home_rounded, appleBlue),
  _TabSpec('Milk', Icons.local_drink_rounded, appleGreen),
  _TabSpec('Credit', Icons.volunteer_activism_rounded, appleGreen),
  _TabSpec('Expenses', Icons.receipt_long_rounded, appleBlue),
  _TabSpec('Salary', Icons.payments_rounded, salaryGreen),
  _TabSpec('Diary', Icons.menu_book_rounded, diaryOrange),
  _TabSpec('Business', Icons.work_rounded, appleBlue),
];""",
              label='module identity colors',
          )

          replace_exact(
              """List<Color> _moduleTabColors(Map<String, dynamic> state) => <Color>[
      appleBlue,
      _tone(_milkGlobalNet(state)),
      _tone(_creditGlobalNet(state)),
      semanticRed,
      _tone(_salaryGlobalNet(state)),
      diaryOrange,
      appleBlue,
    ];""",
              """List<Color> _moduleTabColors(Map<String, dynamic> state) => const <Color>[
      appleBlue,
      appleGreen,
      appleGreen,
      appleBlue,
      salaryGreen,
      diaryOrange,
      appleBlue,
    ];""",
              label='stable bottom navigation colors',
          )

          patch_section(
              'ThemeData _theme(Brightness brightness) {',
              'class _AmbientBackground',
              [
                  (
                      """inputDecorationTheme: InputDecorationTheme(
      filled: true,
      fillColor: dark
          ? const Color(0x2E767680)
          : const Color(0x17767680),
      contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 15),
      hintStyle: const TextStyle(color: systemGray, fontWeight: FontWeight.w500),
      labelStyle: const TextStyle(fontWeight: FontWeight.w700),
      prefixIconColor: appleBlue,
      border: OutlineInputBorder(
        borderRadius: BorderRadius.circular(16),
        borderSide: BorderSide(color: outline),
      ),
      enabledBorder: OutlineInputBorder(
        borderRadius: BorderRadius.circular(16),
        borderSide: BorderSide(color: outline),
      ),
      focusedBorder: OutlineInputBorder(
        borderRadius: BorderRadius.circular(16),
        borderSide: const BorderSide(color: appleBlue, width: 1.4),
      ),
    ),""",
                      """inputDecorationTheme: InputDecorationTheme(
      filled: true,
      fillColor: dark ? const Color(0x2EFFFFFF) : const Color(0xE8FFFFFF),
      contentPadding: const EdgeInsets.symmetric(horizontal: 20, vertical: 19),
      hintStyle: const TextStyle(
        color: systemGray,
        fontSize: 16.5,
        fontWeight: FontWeight.w600,
      ),
      labelStyle: const TextStyle(fontSize: 15.5, fontWeight: FontWeight.w700),
      prefixIconColor: appleBlue,
      border: OutlineInputBorder(
        borderRadius: BorderRadius.circular(20),
        borderSide: BorderSide(color: outline),
      ),
      enabledBorder: OutlineInputBorder(
        borderRadius: BorderRadius.circular(20),
        borderSide: BorderSide(
          color: dark ? Colors.white.withAlpha(34) : appleBlue.withAlpha(34),
        ),
      ),
      focusedBorder: OutlineInputBorder(
        borderRadius: BorderRadius.circular(20),
        borderSide: const BorderSide(color: appleBlue, width: 1.5),
      ),
    ),""",
                      1,
                  ),
              ],
              'theme inputs',
          )

          patch_section(
              'class _ScreenHeader extends StatelessWidget {',
              'class _CircleAction extends StatelessWidget {',
              [
                  ("color: dark ? const Color(0xC7000000) : const Color(0xD1F5F5F7),", "color: dark ? const Color(0xD6000000) : const Color(0xF2FFFFFF),", 1),
                  ('padding: const EdgeInsets.fromLTRB(20, 11, 16, 12),', 'padding: const EdgeInsets.fromLTRB(24, 14, 20, 16),', 1),
                  ('fontSize: leading == null ? 25 : 20,', 'fontSize: leading == null ? 30 : 26,', 1),
              ],
              'screen header',
          )

          patch_section(
              'class _CircleAction extends StatelessWidget {',
              'class _BackCircle extends StatelessWidget {',
              [
                  ('borderRadius: BorderRadius.circular(22),', 'borderRadius: BorderRadius.circular(18),', 1),
                  ('width: 40,\n            height: 40,', 'width: 48,\n            height: 48,', 1),
                  ('shape: BoxShape.circle,', 'borderRadius: BorderRadius.circular(18),', 1),
                  ('child: Icon(icon, size: 18, color: color),', 'child: Icon(icon, size: 21, color: color),', 1),
              ],
              'header action buttons',
          )

          patch_section(
              'class _BackCircle extends StatelessWidget {',
              'class _SearchBox extends StatefulWidget {',
              [
                  ('width: 40,\n          height: 40,', 'width: 48,\n          height: 48,', 1),
                  ('borderRadius: BorderRadius.circular(22),', 'borderRadius: BorderRadius.circular(24),', 1),
              ],
              'back button',
          )

          patch_section(
              'class _SearchBoxState extends State<_SearchBox> {',
              'class _DateField extends StatelessWidget {',
              [
                  ('borderRadius: BorderRadius.circular(16),', 'borderRadius: BorderRadius.circular(20),', 2),
                  ('style: TextStyle(color: widget.color, fontWeight: FontWeight.w800),', 'style: TextStyle(color: widget.color, fontSize: 17, fontWeight: FontWeight.w800),', 1),
                  ('fontWeight: FontWeight.w800,\n        ),', 'fontSize: 16.5,\n          fontWeight: FontWeight.w800,\n        ),', 1),
              ],
              'search field',
          )

          patch_section(
              'class _PrimaryButton extends StatelessWidget {',
              'class _AmountHero extends StatelessWidget {',
              [
                  ('compact ? 14 : 17', 'compact ? 18 : 20', 2),
                  ('height: compact ? 40 : 54,', 'height: compact ? 50 : 58,', 1),
                  ('horizontal: compact ? 15 : 20', 'horizontal: compact ? 18 : 22', 1),
                  ('size: compact ? 17 : 20', 'size: compact ? 19 : 22', 1),
                  ('fontSize: compact ? 13 : 15,', 'fontSize: compact ? 15 : 17,', 1),
              ],
              'primary buttons',
          )

          patch_section(
              'class _AmountHero extends StatelessWidget {',
              'class _HeroValue extends StatelessWidget {',
              [
                  ('padding: const EdgeInsets.all(20),', 'padding: const EdgeInsets.all(24),', 1),
                  ('borderRadius: BorderRadius.circular(28),', 'borderRadius: BorderRadius.circular(30),', 1),
              ],
              'amount hero',
          )

          patch_section(
              'class _HeroValue extends StatelessWidget {',
              'class _ListCard extends StatelessWidget {',
              [
                  ('fontSize: 10,', 'fontSize: 12,', 1),
                  ('fontSize: small ? 20 : 31,', 'fontSize: small ? 22 : 34,', 1),
              ],
              'hero typography',
          )

          patch_section(
              'class _ListCard extends StatelessWidget {',
              'class _SectionTitle extends StatelessWidget {',
              [
                  ('borderRadius: BorderRadius.circular(24),', 'borderRadius: BorderRadius.circular(28),', 1),
                  ('borderRadius: 24,', 'borderRadius: 28,', 1),
                  ('padding: const EdgeInsets.all(15),', 'padding: const EdgeInsets.all(17),', 1),
                  ('width: 44,\n                  height: 44,', 'width: 52,\n                  height: 52,', 1),
                  ('borderRadius: BorderRadius.circular(14),', 'borderRadius: BorderRadius.circular(17),', 1),
                  ('fontSize: 16,', 'fontSize: 19,', 1),
                  ('fontSize: 13,', 'fontSize: 14,', 1),
                  ('fontSize: 15,', 'fontSize: 17,', 1),
                  ('width: 42,\n                        height: 42,', 'width: 48,\n                        height: 48,', 1),
              ],
              'list cards',
          )

          patch_section(
              'class _SectionTitle extends StatelessWidget {',
              'class _MonthYearPicker extends StatelessWidget {',
              [
                  ('fontSize: 18,', 'fontSize: 22,', 1),
              ],
              'section titles',
          )

          patch_section(
              'class _MonthYearPicker extends StatelessWidget {',
              'class _SheetFrame extends StatelessWidget {',
              [
                  ('const SizedBox(width: 10),', 'const SizedBox(width: 12),', 1),
                  ('width: 112,', 'width: 126,', 1),
                  ('contentPadding: const EdgeInsets.all(14),', 'contentPadding: const EdgeInsets.all(17),', 1),
                  ('BorderRadius.circular(16)', 'BorderRadius.circular(20)', 2),
              ],
              'month year picker',
          )

          patch_section(
              'class _SheetFrame extends StatelessWidget {',
              'Future<T?> _openSheet<T>',
              [
                  ('borderRadius: const BorderRadius.vertical(top: Radius.circular(28)),', 'borderRadius: const BorderRadius.vertical(top: Radius.circular(36)),', 1),
                  ('            20,\n            10,\n            20,', '            24,\n            12,\n            24,', 1),
                  ('width: 48,\n                  height: 6,', 'width: 54,\n                  height: 6,', 1),
                  ('const SizedBox(height: 22),', 'const SizedBox(height: 26),', 1),
                  ('fontSize: 23,', 'fontSize: 30,', 1),
                  ('const SizedBox(height: 20),', 'const SizedBox(height: 24),', 1),
              ],
              'bottom sheet frame',
          )

          patch_section(
              'class _BottomLedgerNav extends StatelessWidget {',
              'class _Pressable extends StatefulWidget {',
              [
                  ('height: 70,', 'height: 86,', 1),
                  ('width: 70,\n                        height: 58,', 'width: 80,\n                        height: 72,', 1),
                  ('borderRadius: BorderRadius.circular(16),', 'borderRadius: BorderRadius.circular(20),', 2),
                  ('size: 20,', 'size: 27,', 1),
                  ('fontSize: 9.5,', 'fontSize: 12,', 1),
                  ('const SizedBox(height: 3),', 'const SizedBox(height: 4),', 2),
                  ('width: active ? 34 : 0,\n                              height: 3,', 'width: active ? 38 : 0,\n                              height: 4,', 1),
              ],
              'bottom navigation',
          )

          patch_section(
              'class _CreditScreenState extends State<CreditScreen> {',
              'class CreditDetailScreen extends StatelessWidget {',
              [
                  ("title: 'Credit Entry',", "title: 'Credit / Loan Entry',", 1),
                  ('final Color moduleColor = _tone(net);', 'final Color moduleColor = appleGreen;\n    final Color balanceColor = _tone(net, neutral: appleGreen);', 1),
                  ('color: moduleColor,\n              ),\n              const SizedBox(height: 18),', 'color: balanceColor,\n              ),\n              const SizedBox(height: 18),', 1),
                  (
                      """const SizedBox(height: 13),
            SegmentedButton<String>(
              segments: const <ButtonSegment<String>>[
                ButtonSegment<String>(
                  value: 'credit',
                  label: Text('Given (+)'),
                  icon: Icon(Icons.arrow_upward_rounded),
                ),
                ButtonSegment<String>(
                  value: 'debit',
                  label: Text('Taken (-)'),
                  icon: Icon(Icons.arrow_downward_rounded),
                ),
              ],
              selected: <String>{type},
              onSelectionChanged: (Set<String> values) {
                HapticFeedback.selectionClick();
                setSheetState(() => type = values.first);
              },
            ),
            const SizedBox(height: 20),
            _PrimaryButton(
              label: type == 'credit' ? 'Save Given' : 'Save Taken',
              color: type == 'credit' ? appleGreen : appleRed,
              onTap: () => Navigator.pop(sheetContext, true),
            ),""",
                      """const SizedBox(height: 22),
            Row(
              children: <Widget>[
                Expanded(
                  child: _PrimaryButton(
                    label: 'Given',
                    icon: Icons.add_rounded,
                    color: appleGreen,
                    onTap: () {
                      type = 'credit';
                      Navigator.pop(sheetContext, true);
                    },
                  ),
                ),
                const SizedBox(width: 12),
                Expanded(
                  child: _PrimaryButton(
                    label: 'Taken',
                    icon: Icons.remove_rounded,
                    color: appleRed,
                    onTap: () {
                      type = 'debit';
                      Navigator.pop(sheetContext, true);
                    },
                  ),
                ),
              ],
            ),""",
                      1,
                  ),
              ],
              'credit reference sheet',
          )

          replace_exact("title: 'Salary Entry',", "title: 'Add Salary Entry',", label='salary sheet title')
          replace_exact("label: 'Create Account',", "label: 'Create Khata',", label='business create button')

          patch_section(
              'class ExpenseScreen extends StatefulWidget {',
              'class ExpenseDetailScreen extends StatefulWidget {',
              [
                  ("title: 'Expenses',\n          color: semanticRed,", "title: 'Expenses',\n          color: appleBlue,", 1),
                  ("label: 'Month Expense',\n                value: _money(total),\n                color: semanticRed,", "label: 'Month Expense',\n                value: _money(total),\n                color: appleBlue,", 1),
              ],
              'expense reference colors',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Format
        run: dart format lib/main.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test ledger invariants
        run: flutter test

      - name: Commit verified UI upgrade and restore CI
        shell: bash
        run: |
          git show HEAD^:.github/workflows/flutter-ci.yml > .github/workflows/flutter-ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart .github/workflows/flutter-ci.yml
          git commit -m "Match Flutter UI to reference design"
          git push origin HEAD:main
