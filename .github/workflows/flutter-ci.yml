name: One-shot Reference UI Upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/flutter-ci.yml"
      - ".github/ui_patch.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch_reference_ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Apply screenshot-matched UI patch
        run: python3 .github/ui_patch.py

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Format
        run: dart format lib/main.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test ledger invariants
        run: flutter test

      - name: Commit verified UI upgrade and restore CI
        shell: bash
        run: |
          git show 2a0c79d99a522f9b05c765450b10df6eeed3466d^:.github/workflows/flutter-ci.yml > .github/workflows/flutter-ci.yml
          git rm .github/ui_patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart .github/workflows/flutter-ci.yml
          git commit -m "Match Flutter UI to reference design"
          git push origin HEAD:main
