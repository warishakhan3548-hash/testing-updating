name: Flutter APK Build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "firebase/**"
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve packages
        run: flutter pub get

      - name: Normalize Dart formatting in runner
        run: dart format lib/main.dart lib/ai_bridge.dart test/ai_bridge_test.dart

      - name: Analyzer diagnostics
        continue-on-error: true
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aarish-Dairy-Pro-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
