name: Flutter Static Analysis

# Static-only verification for the Flutter source. This workflow never builds an APK.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "firebase/**"
      - "lib/**"
      - "test/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Verify formatting
        run: dart format --language-version latest --output=none --set-exit-if-changed lib/main.dart lib/ai_bridge.dart test/ai_bridge_test.dart

      - name: Analyze
        run: flutter analyze --fatal-infos
