name: Interaction Physics Surgeon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/interaction-physics-surgeon.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interaction-physics-surgeon-main
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden accessibility and lifecycle motion contracts
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/interaction_patch.py
          python3 /tmp/interaction_patch.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format surgical scope
        run: dart format --language-version latest lib/main.dart test/ui_micro_aesthetics_test.dart

      - name: Verify accessibility and visual contracts
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/interaction_verify.py
          python3 /tmp/interaction_verify.py

      - name: Analyze
        run: flutter analyze

      - name: Run all tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Verify exact change scope
        shell: bash
        run: |
          git diff --exit-code -- pubspec.lock
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for file in "${changed[@]}"; do
            case "$file" in
              lib/main.dart|test/ui_micro_aesthetics_test.dart) ;;
              *) echo "Unexpected changed file: $file" >&2; exit 1 ;;
            esac
          done

      - name: Commit and push verified interaction hardening
        shell: bash
        run: |
          if git diff --quiet -- lib/main.dart test/ui_micro_aesthetics_test.dart; then
            echo "Accessibility and lifecycle contracts already satisfied; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart test/ui_micro_aesthetics_test.dart
          git commit -m "Harden premium motion accessibility and lifecycle"
          git push origin HEAD:main