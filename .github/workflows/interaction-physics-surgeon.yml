name: Interaction Physics Surgeon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/interaction-physics-surgeon.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interaction-physics-surgeon-main
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Stabilize premium interaction render tree
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main_path = Path('lib/main.dart')
          test_path = Path('test/ui_micro_aesthetics_test.dart')
          source = main_path.read_text()
          tests = test_path.read_text()

          # Lock approved visual identity. This surgeon may change render-tree
          # ownership and compositing only; colors, dimensions and icons stay exact.
          visual_sentinels = (
              'static const double cardRadius = 24;',
              'static const double heroRadius = 28;',
              'static const double sheetRadius = 36;',
              'const IconData premiumHomeIcon = Icons.space_dashboard_rounded;',
              'const IconData premiumExpenseIcon = Icons.shopping_bag_rounded;',
              'const IconData premiumDeleteIcon = Icons.delete_outline_rounded;',
              'width: 84,',
              'height: 70,',
              'height: 88,',
              'Color(0xFAFFFFFF), Color(0xF2FFFFFF)',
              'Color(0xF0121826), Color(0xE3080C18)',
          )
          before_visual = {token: source.count(token) for token in visual_sentinels}

          old_ripple_build = '''  @override
          Widget build(BuildContext context) {
            Widget surface = widget.child;
            if (_pulses.isNotEmpty) {
              final List<_RipplePulse> snapshot = List<_RipplePulse>.unmodifiable(
                _pulses,
              );
              final Listenable repaint = Listenable.merge(
                snapshot
                    .map<Listenable>((_RipplePulse pulse) => pulse.controller)
                    .toList(),
              );
              surface = Stack(
                fit: StackFit.expand,
                children: <Widget>[
                  widget.child,
                  IgnorePointer(
                    child: RepaintBoundary(
                      child: CustomPaint(
                        painter: _GlobalTapRipplePainter(
                          pulses: snapshot,
                          repaint: repaint,
                        ),
                      ),
                    ),
                  ),
                ],
              );
            }

            return Listener(
              behavior: HitTestBehavior.translucent,
              onPointerDown: _handlePointerDown,
              onPointerMove: _handlePointerMove,
              onPointerUp: _handlePointerUp,
              onPointerCancel: _handlePointerCancel,
              child: surface,
            );
          }'''

          new_ripple_build = '''  @override
          Widget build(BuildContext context) {
            // The application subtree must keep the same parent whether a pulse
            // exists or not. Conditionally inserting/removing the Stack would
            // reparent the Navigator subtree on every tap, causing avoidable
            // element churn and risking focus/state discontinuities.
            final List<_RipplePulse> snapshot = List<_RipplePulse>.unmodifiable(
              _pulses,
            );

            return Listener(
              behavior: HitTestBehavior.translucent,
              onPointerDown: _handlePointerDown,
              onPointerMove: _handlePointerMove,
              onPointerUp: _handlePointerUp,
              onPointerCancel: _handlePointerCancel,
              child: Stack(
                fit: StackFit.expand,
                children: <Widget>[
                  widget.child,
                  if (snapshot.isNotEmpty)
                    IgnorePointer(
                      child: RepaintBoundary(
                        child: CustomPaint(
                          painter: _GlobalTapRipplePainter(
                            pulses: snapshot,
                            repaint: Listenable.merge(
                              snapshot
                                  .map<Listenable>(
                                    (_RipplePulse pulse) => pulse.controller,
                                  )
                                  .toList(),
                            ),
                          ),
                        ),
                      ),
                    ),
                ],
              ),
            );
          }'''

          if 'Widget surface = widget.child;' in source:
              count = source.count(old_ripple_build)
              if count != 1:
                  raise SystemExit(
                      f'global ripple build: expected exactly 1 current block, found {count}'
                  )
              source = source.replace(old_ripple_build, new_ripple_build, 1)
          else:
              ripple_start = source.index('class _GlobalTapRippleLayerState')
              ripple_end = source.index('class _GlobalTapRipplePainter', ripple_start)
              ripple_source = source[ripple_start:ripple_end]
              required_existing = (
                  'final List<_RipplePulse> snapshot = List<_RipplePulse>.unmodifiable(',
                  'child: Stack(',
                  'if (snapshot.isNotEmpty)',
              )
              missing = [token for token in required_existing if token not in ripple_source]
              if missing:
                  raise SystemExit(f'global ripple stable-tree contract missing: {missing}')

          shell_start = source.index('class _AppShellState extends State<AppShell>')
          shell_end = source.index('class _KeepAlivePage extends StatefulWidget', shell_start)
          shell = source[shell_start:shell_end]
          old_page_child = '''  Widget _buildSwipeMotionPage(int index, Widget child) => AnimatedBuilder(
            animation: _pageController,
            child: child,
            builder: (BuildContext context, Widget? stableChild) {'''
          new_page_child = '''  Widget _buildSwipeMotionPage(int index, Widget child) => AnimatedBuilder(
            animation: _pageController,
            // Isolate the expensive live screen from the small transform layer.
            // The page can repaint when its own data changes, while swipe frames
            // can usually be satisfied by compositor work instead of repainting
            // every card, list row and shadow below the 3D transform.
            child: RepaintBoundary(child: child),
            builder: (BuildContext context, Widget? stableChild) {'''
          if 'child: RepaintBoundary(child: child),' not in shell:
              count = shell.count(old_page_child)
              if count != 1:
                  raise SystemExit(
                      f'swipe compositor boundary: expected 1 current block, found {count}'
                  )
              shell = shell.replace(old_page_child, new_page_child, 1)
              source = source[:shell_start] + shell + source[shell_end:]

          after_visual = {token: source.count(token) for token in visual_sentinels}
          if before_visual != after_visual:
              changed = {
                  token: (before_visual[token], after_visual[token])
                  for token in visual_sentinels
                  if before_visual[token] != after_visual[token]
              }
              raise SystemExit(f'visual lock violated: {changed}')

          guard_marker = '    // Stable global feedback must never reparent the application subtree.\n'
          if guard_marker not in tests:
              insertion_point = tests.index(
                  '    // Brand/state color logic and Firebase integration must stay untouched.\n'
              )
              guard = '''    // Stable global feedback must never reparent the application subtree.
              final int rippleStart = source.indexOf('class _GlobalTapRippleLayerState');
              final int rippleEnd = source.indexOf(
                'class _GlobalTapRipplePainter',
                rippleStart,
              );
              expect(rippleStart, greaterThanOrEqualTo(0));
              expect(rippleEnd, greaterThan(rippleStart));
              final String rippleSource = source.substring(rippleStart, rippleEnd);
              expect(rippleSource, isNot(contains('Widget surface = widget.child;')));
              expect(
                rippleSource,
                contains('final List<_RipplePulse> snapshot = List<_RipplePulse>.unmodifiable('),
              );
              expect(rippleSource, contains('child: Stack('));
              expect(rippleSource, contains('if (snapshot.isNotEmpty)'));
              expect(rippleSource, contains('widget.child,'));

              // Swipe depth is a compositor concern; the live ledger screen below
              // it remains its own repaint boundary so 60/90/120Hz transforms do
              // not force every card and row to repaint on each gesture frame.
              final int shellStart = source.indexOf(
                'class _AppShellState extends State<AppShell>',
              );
              final int shellEnd = source.indexOf(
                'class _KeepAlivePage extends StatefulWidget',
                shellStart,
              );
              expect(shellStart, greaterThanOrEqualTo(0));
              expect(shellEnd, greaterThan(shellStart));
              final String shellSource = source.substring(shellStart, shellEnd);
              expect(
                shellSource,
                contains('child: RepaintBoundary(child: child),'),
              );

          '''
              tests = tests[:insertion_point] + guard + tests[insertion_point:]

          main_path.write_text(source)
          test_path.write_text(tests)
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format surgical scope
        run: dart format --language-version latest lib/main.dart test/ui_micro_aesthetics_test.dart

      - name: Verify interaction contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('lib/main.dart').read_text()
          tests = Path('test/ui_micro_aesthetics_test.dart').read_text()

          ripple_start = source.index('class _GlobalTapRippleLayerState')
          ripple_end = source.index('class _GlobalTapRipplePainter', ripple_start)
          ripple = source[ripple_start:ripple_end]
          if 'Widget surface = widget.child;' in ripple:
              raise SystemExit('global ripple still reparents the application subtree')
          for token in (
              'final List<_RipplePulse> snapshot = List<_RipplePulse>.unmodifiable(',
              'child: Stack(',
              'if (snapshot.isNotEmpty)',
              'widget.child,',
          ):
              if token not in ripple:
                  raise SystemExit(f'missing stable ripple contract: {token}')

          shell_start = source.index('class _AppShellState extends State<AppShell>')
          shell_end = source.index('class _KeepAlivePage extends StatefulWidget', shell_start)
          shell = source[shell_start:shell_end]
          for token in (
              'child: RepaintBoundary(child: child),',
              '..setEntry(3, 2, .00075)',
              '..rotateY(-delta * .018)',
              'offset: Offset(0, depth * 1.8)',
              'physics: const _LedgerPagePhysics(',
          ):
              if token not in shell:
                  raise SystemExit(f'missing swipe/compositor contract: {token}')

          if 'Stable global feedback must never reparent the application subtree.' not in tests:
              raise SystemExit('missing regression guard')
          PY

      - name: Analyze
        run: flutter analyze

      - name: Run all tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Verify exact change scope
        shell: bash
        run: |
          git diff --exit-code -- pubspec.lock
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for file in "${changed[@]}"; do
            case "$file" in
              lib/main.dart|test/ui_micro_aesthetics_test.dart) ;;
              *) echo "Unexpected changed file: $file" >&2; exit 1 ;;
            esac
          done

      - name: Commit and push verified interaction upgrade
        shell: bash
        run: |
          if git diff --quiet -- lib/main.dart test/ui_micro_aesthetics_test.dart; then
            echo "Interaction contracts already satisfied; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart test/ui_micro_aesthetics_test.dart
          git commit -m "Stabilize premium interaction render tree"
          git push origin HEAD:main
