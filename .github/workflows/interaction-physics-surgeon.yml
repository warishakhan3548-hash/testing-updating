name: Interaction Physics Surgeon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/interaction-physics-surgeon.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interaction-physics-surgeon-main
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply interaction runtime upgrade
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('lib/main.dart')
          test_path = Path('test/ui_micro_aesthetics_test.dart')
          source = main_path.read_text()
          tests = test_path.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # Visual lock: these approved appearance/geometry/icon tokens must not move.
          visual_sentinels = (
              'static const double cardRadius = 24;',
              'static const double heroRadius = 28;',
              'static const double sheetRadius = 36;',
              "const IconData premiumHomeIcon = Icons.space_dashboard_rounded;",
              "const IconData premiumExpenseIcon = Icons.shopping_bag_rounded;",
              "const IconData premiumDeleteIcon = Icons.delete_outline_rounded;",
              'Color(0xFAFFFFFF), Color(0xF2FFFFFF)',
              'Color(0xF0121826), Color(0xE3080C18)',
              'blurRadius: 52',
              'spreadRadius: -1.25',
              'width: 84,',
              'height: 70,',
              'height: 88,',
          )
          before_visual = {token: source.count(token) for token in visual_sentinels}

          # 1) Bottom navigation: keep the exact rendered subtree, but subscribe only
          # to projection-derived color changes instead of every sync notification.
          nav_start = source.index('class _BottomLedgerNav extends StatelessWidget {')
          nav_body_marker = '  Widget _buildNavigation(BuildContext context) {'
          nav_body_start = source.index(nav_body_marker, nav_start)
          old_prefix = source[nav_start:nav_body_start + len(nav_body_marker)]
          if 'AnimatedBuilder' not in old_prefix:
              raise SystemExit('bottom navigation baseline drifted')
          new_prefix = '\n'.join([
              'class _BottomLedgerNav extends StatefulWidget {',
              '  const _BottomLedgerNav({',
              '    required this.sync,',
              '    required this.selected,',
              '    required this.controller,',
              '    required this.onSelected,',
              '  });',
              '',
              '  final LedgerSyncService sync;',
              '  final int selected;',
              '  final ScrollController controller;',
              '  final ValueChanged<int> onSelected;',
              '',
              '  @override',
              '  State<_BottomLedgerNav> createState() => _BottomLedgerNavState();',
              '}',
              '',
              'class _BottomLedgerNavState extends State<_BottomLedgerNav> {',
              '  late List<Color> _colors;',
              '',
              '  LedgerSyncService get sync => widget.sync;',
              '  int get selected => widget.selected;',
              '  ScrollController get controller => widget.controller;',
              '  ValueChanged<int> get onSelected => widget.onSelected;',
              '',
              '  @override',
              '  void initState() {',
              '    super.initState();',
              '    _colors = _moduleTabColors(sync.currentProjection);',
              '    sync.addListener(_handleSyncChange);',
              '  }',
              '',
              '  @override',
              '  void didUpdateWidget(covariant _BottomLedgerNav oldWidget) {',
              '    super.didUpdateWidget(oldWidget);',
              '    if (oldWidget.sync == widget.sync) return;',
              '    oldWidget.sync.removeListener(_handleSyncChange);',
              '    _colors = _moduleTabColors(sync.currentProjection);',
              '    sync.addListener(_handleSyncChange);',
              '  }',
              '',
              '  void _handleSyncChange() {',
              '    final List<Color> colors = _moduleTabColors(sync.currentProjection);',
              '    if (!mounted || listEquals(_colors, colors)) return;',
              '    setState(() => _colors = colors);',
              '  }',
              '',
              '  @override',
              '  void dispose() {',
              '    sync.removeListener(_handleSyncChange);',
              '    super.dispose();',
              '  }',
              '',
              '  @override',
              '  Widget build(BuildContext context) => _buildNavigation(context);',
              '',
              nav_body_marker,
          ])
          source = source[:nav_start] + new_prefix + source[nav_body_start + len(nav_body_marker):]

          nav_body_start = source.index(nav_body_marker, nav_start)
          nav_color_line = '    final List<Color> colors = _moduleTabColors(sync.currentProjection);'
          nav_color_index = source.index(nav_color_line, nav_body_start)
          source = source[:nav_color_index] + '    final List<Color> colors = _colors;' + source[nav_color_index + len(nav_color_line):]

          # 2) Navigation recentering: settle time follows actual remaining travel;
          # tiny corrections jump directly so rapid retargets never queue latency.
          source = replace_once(
              source,
              '''    if ((position.pixels - target).abs() < .5) return;
    if (AppMotion.reduce(context)) {
      position.jumpTo(target);
      return;
    }
    _navController.animateTo(
      target,
      duration: UIConstants.motion,
      curve: UIConstants.motionOut,
    );''',
              '''    final double navTravel = (position.pixels - target).abs();
    if (navTravel < .5) return;
    if (AppMotion.reduce(context) || navTravel < 3) {
      position.jumpTo(target);
      return;
    }
    final double normalizedTravel = (navTravel / itemExtent)
        .clamp(.12, 1.0)
        .toDouble();
    final int adaptiveMicros =
        (UIConstants.motion.inMicroseconds * math.sqrt(normalizedTravel))
            .round()
            .clamp(
              const Duration(milliseconds: 90).inMicroseconds,
              UIConstants.motion.inMicroseconds,
            )
            .toInt();
    _navController.animateTo(
      target,
      duration: Duration(microseconds: adaptiveMicros),
      curve: UIConstants.motionOut,
    );''',
              'adaptive bottom-nav settle',
          )

          # 3) Press physics: generation ownership prevents an old release spring
          # from cleaning the spatial state of a newer touch. Release energy is
          # coupled to actual press depth, preserving velocity feel without kick.
          source = replace_once(
              source,
              '  Offset _gestureVelocity = Offset.zero;',
              '  Offset _gestureVelocity = Offset.zero;\n  int _pressMotionGeneration = 0;',
              'press generation field',
          )
          source = replace_once(
              source,
              '''  void _resetPressFeedback() {
    _pressController.stop();
    if (_pressController.value != 0) _pressController.value = 0;
    _touchAlignment = Alignment.center;
    _releaseAlignment = null;
    _lastTouchPosition = null;
    _lastTouchSampleMicros = 0;
    _gestureVelocity = Offset.zero;
  }''',
              '''  void _resetPressFeedback() {
    _pressMotionGeneration++;
    _pressController.stop();
    if (_pressController.value != 0) _pressController.value = 0;
    _clearTouchState();
  }

  void _clearTouchState() {
    _touchAlignment = Alignment.center;
    _releaseAlignment = null;
    _lastTouchPosition = null;
    _lastTouchSampleMicros = 0;
    _gestureVelocity = Offset.zero;
  }''',
              'press reset ownership',
          )
          source = replace_once(
              source,
              '''  void _captureTouch(TapDownDetails details) {
    _releaseAlignment = null;''',
              '''  void _captureTouch(TapDownDetails details) {
    _pressMotionGeneration++;
    _releaseAlignment = null;''',
              'new press ownership',
          )
          source = replace_once(
              source,
              '''    if (AppMotion.reduce(context)) {
      _pressController.stop();
      if (_pressController.value != 0) _pressController.value = 0;
      return;
    }''',
              '''    if (AppMotion.reduce(context)) {
      _pressMotionGeneration++;
      _pressController.stop();
      if (_pressController.value != 0) _pressController.value = 0;
      _clearTouchState();
      return;
    }''',
              'reduced-motion release cleanup',
          )
          source = replace_once(
              source,
              '''    final double gestureReleaseVelocity = _releaseDepthVelocity(
      gestureVelocity,
      cancelled: cancelled,
    );''',
              '''    final double pressDepth = _pressController.value
        .clamp(0.0, 1.0)
        .toDouble();
    final double depthCoupling = math.sqrt(pressDepth);
    final double gestureReleaseVelocity =
        _releaseDepthVelocity(
          gestureVelocity,
          cancelled: cancelled,
        ) *
        depthCoupling;''',
              'depth-coupled release velocity',
          )
          source = replace_once(
              source,
              '''    if (_pressController.value.abs() <= .0001 &&
        releaseVelocity.abs() <= .0001) {
      if (_pressController.value != 0) _pressController.value = 0;
      return;
    }
    _pressController.animateWith(
      SpringSimulation(
        UIConstants.pressSpring,
        _pressController.value,
        0,
        releaseVelocity,
      ),
    );''',
              '''    if (_pressController.value.abs() <= .0001 &&
        releaseVelocity.abs() <= .0001) {
      _pressMotionGeneration++;
      if (_pressController.value != 0) _pressController.value = 0;
      _clearTouchState();
      return;
    }
    final int motionGeneration = ++_pressMotionGeneration;
    _pressController
        .animateWith(
          SpringSimulation(
            UIConstants.pressSpring,
            _pressController.value,
            0,
            releaseVelocity,
          ),
        )
        .whenCompleteOrCancel(() {
          if (!mounted || motionGeneration != _pressMotionGeneration) return;
          if (_pressController.value.abs() <= .002 &&
              _pressController.value != 0) {
            _pressController.value = 0;
          }
          _clearTouchState();
        });''',
              'generation-safe spring completion',
          )

          after_visual = {token: source.count(token) for token in visual_sentinels}
          if before_visual != after_visual:
              changed = {
                  token: (before_visual[token], after_visual[token])
                  for token in visual_sentinels
                  if before_visual[token] != after_visual[token]
              }
              raise SystemExit(f'visual lock violated: {changed}')

          # Upgrade existing regression guards to describe the new behavioral core.
          tests = replace_once(
              tests,
              "    expect(source, contains('(position.pixels - target).abs() < .5'));",
              """    expect(
      source,
      contains('final double navTravel = (position.pixels - target).abs()'),
    );
    expect(source, contains('if (navTravel < .5) return;'));
    expect(source, contains('AppMotion.reduce(context) || navTravel < 3'));
    expect(source, contains('Duration(microseconds: adaptiveMicros)'));""",
              'navigation regression guard',
          )
          tests = replace_once(
              tests,
              "    expect(pressableSource, contains('Offset _gestureVelocity = Offset.zero'));",
              """    expect(pressableSource, contains('Offset _gestureVelocity = Offset.zero'));
    expect(pressableSource, contains('int _pressMotionGeneration = 0'));
    expect(pressableSource, contains('void _clearTouchState()'));
    expect(pressableSource, contains('final double depthCoupling = math.sqrt(pressDepth)'));
    expect(pressableSource, contains('motionGeneration != _pressMotionGeneration'));
    expect(pressableSource, contains('.whenCompleteOrCancel(() {'));""",
              'press ownership regression guard',
          )
          tests = replace_once(
              tests,
              '    // Brand/state color logic and Firebase integration must stay untouched.',
              '''    expect(
      source,
      contains('class _BottomLedgerNav extends StatefulWidget'),
    );
    expect(source, contains('listEquals(_colors, colors)'));
    expect(source, contains('final List<Color> colors = _colors;'));

    // Brand/state color logic and Firebase integration must stay untouched.''',
              'bottom-nav rebuild guard',
          )

          main_path.write_text(source)
          test_path.write_text(tests)
          PY

      - name: Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format and verify interaction upgrade
        run: |
          dart format lib/main.dart test/ui_micro_aesthetics_test.dart
          git diff --check
          flutter analyze
          flutter test
          flutter build apk --debug

      - name: Enforce surgical file scope
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()
          allowed = {
              'lib/main.dart',
              'test/ui_micro_aesthetics_test.dart',
          }
          unexpected = sorted(set(changed) - allowed)
          if unexpected:
              raise SystemExit(f'unexpected changed files: {unexpected}')
          if set(changed) != allowed:
              raise SystemExit(f'expected exactly {sorted(allowed)}, got {changed}')
          PY

      - name: Commit and push verified interaction upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart test/ui_micro_aesthetics_test.dart
          git diff --cached --quiet && { echo "No app changes to commit"; exit 1; }
          git commit -m "perf(ui): harden interaction ownership and adaptive navigation"
          git push origin HEAD:main
