name: Interaction Physics Surgeon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/interaction-physics-surgeon.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interaction-physics-surgeon-main
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply native interaction smoothness upgrade
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          native_path = Path(
              'android/app/src/main/kotlin/com/aaris/diary/financial/MainActivity.kt'
          )
          test_path = Path('test/native_interaction_physics_test.dart')

          current = native_path.read_text()
          expected = '''package com.aaris.diary.financial

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          '''
          if current.strip() != expected.strip():
              raise SystemExit(
                  'MainActivity.kt no longer matches the audited baseline; '
                  'refusing to overwrite unknown native behavior.'
              )

          native_path.write_text('''package com.aaris.diary.financial

          import android.os.Build
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // Android 15+ can raise display refresh rate while the user is
                  // actively touching this window. The system owns the policy,
                  // so supported 90/120Hz devices get lower touch latency without
                  // pinning a high refresh rate while the UI is idle.
                  if (Build.VERSION.SDK_INT >= 35) {
                      window.setFrameRateBoostOnTouchEnabled(true)
                  }
              }
          }
          ''')

          test_path.write_text(r'''import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('Android touch refresh boost is API-gated and policy-driven', () {
              final String source = File(
                'android/app/src/main/kotlin/com/aaris/diary/financial/MainActivity.kt',
              ).readAsStringSync();

              expect(source, contains('Build.VERSION.SDK_INT >= 35'));
              expect(
                source,
                contains('window.setFrameRateBoostOnTouchEnabled(true)'),
              );

              // Do not force a fixed refresh rate or display mode. Android keeps
              // authority over the actual panel rate and power policy.
              expect(source, isNot(contains('preferredRefreshRate')));
              expect(source, isNot(contains('preferredDisplayModeId')));
              expect(source, isNot(contains('setFrameRate(')));
            });
          }
          ''')
          PY

      - name: Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Verify interaction upgrade
        run: |
          dart format test/native_interaction_physics_test.dart
          git diff --check
          flutter analyze
          flutter test
          flutter build apk --debug

      - name: Enforce absolute visual lock
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()
          allowed = {
              'android/app/src/main/kotlin/com/aaris/diary/financial/MainActivity.kt',
              'test/native_interaction_physics_test.dart',
          }
          unexpected = sorted(set(changed) - allowed)
          if unexpected:
              raise SystemExit(f'unexpected changed files: {unexpected}')
          if not changed:
              raise SystemExit('surgeon produced no changes')

          # The Flutter UI source is intentionally immutable in this upgrade:
          # no colors, card geometry, icon definitions, layout, or assets move.
          ui_diff = subprocess.run(
              ['git', 'diff', '--quiet', '--', 'lib/main.dart']
          ).returncode
          if ui_diff != 0:
              raise SystemExit('visual lock violated: lib/main.dart changed')
          PY

      - name: Commit and push verified interaction upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            android/app/src/main/kotlin/com/aaris/diary/financial/MainActivity.kt \
            test/native_interaction_physics_test.dart
          git diff --cached --quiet && { echo "No app changes to commit"; exit 1; }
          git commit -m "perf(android): boost refresh rate during touch"
          git push origin HEAD:main
