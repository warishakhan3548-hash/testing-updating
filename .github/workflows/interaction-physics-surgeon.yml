name: Interaction Physics Surgeon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/interaction-physics-surgeon.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interaction-physics-surgeon-main
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply interaction runtime upgrade
        shell: bash
        run: |
          python3 -c "import base64;exec(base64.b64decode(''))"

      - name: Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format and verify interaction upgrade
        run: |
          dart format lib/main.dart test/ui_micro_aesthetics_test.dart
          git diff --check
          flutter analyze
          flutter test
          flutter build apk --debug

      - name: Enforce surgical file scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          expected="$(printf 'lib/main.dart\ntest/ui_micro_aesthetics_test.dart')"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit and push verified interaction upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart test/ui_micro_aesthetics_test.dart
          git diff --cached --quiet && { echo "No app changes to commit"; exit 1; }
          git commit -m "perf(ui): harden interaction ownership and adaptive navigation"
          git push origin HEAD:main
