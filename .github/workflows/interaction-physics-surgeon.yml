name: Interaction Physics Surgeon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/interaction-physics-surgeon.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interaction-physics-surgeon-main
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden accessibility and lifecycle motion contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main_path = Path('lib/main.dart')
          test_path = Path('test/ui_micro_aesthetics_test.dart')
          source = main_path.read_text()
          tests = test_path.read_text()

          visual_sentinels = (
              'static const double cardRadius = 24;',
              'static const double heroRadius = 28;',
              'static const double sheetRadius = 36;',
              'const IconData premiumHomeIcon = Icons.space_dashboard_rounded;',
              'const IconData premiumExpenseIcon = Icons.shopping_bag_rounded;',
              'const IconData premiumDeleteIcon = Icons.delete_outline_rounded;',
              'width: 84,',
              'height: 70,',
              'height: 88,',
              'Color(0xFAFFFFFF), Color(0xF2FFFFFF)',
              'Color(0xF0121826), Color(0xE3080C18)',
              '..setEntry(3, 2, .00075)',
              '..rotateY(-delta * .018)',
              'offset: Offset(0, depth * 1.8)',
              '..setEntry(3, 2, .0013)',
          )
          before_visual = {token: source.count(token) for token in visual_sentinels}

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          app_start = source.index('class _AarishDiaryAppState extends State<AarishDiaryApp>')
          app_end = source.index('class _RootStage extends StatelessWidget', app_start)
          app_source = source[app_start:app_end]

          if 'late bool _reduceMotion;' not in app_source:
              source = replace_once(
                  source,
                  '''class _AarishDiaryAppState extends State<AarishDiaryApp> {
  late bool _booting;
  late bool _darkMode;
  String? _userId;''',
                  '''class _AarishDiaryAppState extends State<AarishDiaryApp>
    with WidgetsBindingObserver {
  late bool _booting;
  late bool _darkMode;
  late bool _reduceMotion;
  String? _userId;''',
                  'root observer declaration',
              )
              source = replace_once(
                  source,
                  '''  void initState() {
    super.initState();
    _readRootState();
    widget.sync.addListener(_handleSyncChange);
  }''',
                  '''  void initState() {
    super.initState();
    WidgetsBinding.instance.addObserver(this);
    _readRootState();
    widget.sync.addListener(_handleSyncChange);
  }''',
                  'root observer registration',
              )
              source = replace_once(
                  source,
                  '''  void _readRootState() {
    _booting = widget.sync.booting;
    _darkMode = widget.sync.darkMode;
    _userId = widget.sync.user?.uid;
  }''',
                  '''  void _readRootState() {
    _booting = widget.sync.booting;
    _darkMode = widget.sync.darkMode;
    _reduceMotion = WidgetsBinding.instance.disableAnimations;
    _userId = widget.sync.user?.uid;
  }''',
                  'root motion state initialization',
              )
              source = replace_once(
                  source,
                  '''  @override
  void dispose() {
    widget.sync.removeListener(_handleSyncChange);
    super.dispose();
  }''',
                  '''  @override
  void didChangeAccessibilityFeatures() {
    final bool reduceMotion = WidgetsBinding.instance.disableAnimations;
    if (!mounted || reduceMotion == _reduceMotion) return;
    setState(() => _reduceMotion = reduceMotion);
  }

  @override
  void dispose() {
    WidgetsBinding.instance.removeObserver(this);
    widget.sync.removeListener(_handleSyncChange);
    super.dispose();
  }''',
                  'root accessibility callback and cleanup',
              )
              source = replace_once(
                  source,
                  '    themeAnimationDuration: const Duration(milliseconds: 300),',
                  '''    themeAnimationDuration: _reduceMotion
        ? Duration.zero
        : const Duration(milliseconds: 300),''',
                  'theme reduced-motion duration',
              )

          app_start = source.index('class _AarishDiaryAppState extends State<AarishDiaryApp>')
          app_end = source.index('class _RootStage extends StatelessWidget', app_start)
          app_source = source[app_start:app_end]
          for token in (
              'with WidgetsBindingObserver',
              'late bool _reduceMotion;',
              'WidgetsBinding.instance.addObserver(this);',
              '_reduceMotion = WidgetsBinding.instance.disableAnimations;',
              'void didChangeAccessibilityFeatures()',
              'WidgetsBinding.instance.removeObserver(this);',
              'themeAnimationDuration: _reduceMotion',
          ):
              if token not in app_source:
                  raise SystemExit(f'missing root motion contract: {token}')

          old_scroll = '''  void _scrollToEnd() {
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (_scroll.hasClients) {
        _scroll.animateTo(
          _scroll.position.maxScrollExtent,
          duration: const Duration(milliseconds: 210),
          curve: const Cubic(0.2, 0.8, 0.2, 1),
        );
      }
    });
  }'''
          new_scroll = '''  void _scrollToEnd() {
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (!mounted || !_scroll.hasClients) return;
      final double target = _scroll.position.maxScrollExtent;
      if (AppMotion.reduce(context)) {
        _scroll.jumpTo(target);
        return;
      }
      unawaited(
        _scroll.animateTo(
          target,
          duration: const Duration(milliseconds: 210),
          curve: const Cubic(0.2, 0.8, 0.2, 1),
        ),
      );
    });
  }'''
          if old_scroll in source:
              source = replace_once(source, old_scroll, new_scroll, 'AI scroll lifecycle guard')
          elif new_scroll not in source:
              raise SystemExit('AI scroll block is neither current nor upgraded')

          old_export_switch = '''        AnimatedSwitcher(
          duration: const Duration(milliseconds: 180),'''
          new_export_switch = '''        AnimatedSwitcher(
          duration: AppMotion.reduce(context)
              ? Duration.zero
              : const Duration(milliseconds: 180),'''
          if old_export_switch in source:
              source = replace_once(
                  source,
                  old_export_switch,
                  new_export_switch,
                  'export hint reduced-motion duration',
              )
          elif new_export_switch not in source:
              raise SystemExit('export hint animation block is neither current nor upgraded')

          old_export_option = '''      child: AnimatedContainer(
        duration: const Duration(milliseconds: 220),'''
          new_export_option = '''      child: AnimatedContainer(
        duration: AppMotion.reduce(context)
            ? Duration.zero
            : const Duration(milliseconds: 220),'''
          if old_export_option in source:
              source = replace_once(
                  source,
                  old_export_option,
                  new_export_option,
                  'export option reduced-motion duration',
              )
          elif new_export_option not in source:
              raise SystemExit('export option animation block is neither current nor upgraded')

          after_visual = {token: source.count(token) for token in visual_sentinels}
          if before_visual != after_visual:
              changed = {
                  token: (before_visual[token], after_visual[token])
                  for token in visual_sentinels
                  if before_visual[token] != after_visual[token]
              }
              raise SystemExit(f'visual lock violated: {changed}')

          guard_marker = '    // Root, delayed-scroll and export motion honor live platform accessibility.\n'
          if guard_marker not in tests:
              insertion_marker = '    // Brand/state color logic and Firebase integration must stay untouched.\n'
              insertion_point = tests.index(insertion_marker)
              guard = '''    // Root, delayed-scroll and export motion honor live platform accessibility.
    final int rootMotionStart = source.indexOf(
      'class _AarishDiaryAppState extends State<AarishDiaryApp>',
    );
    final int rootMotionEnd = source.indexOf(
      'class _RootStage extends StatelessWidget',
      rootMotionStart,
    );
    expect(rootMotionStart, greaterThanOrEqualTo(0));
    expect(rootMotionEnd, greaterThan(rootMotionStart));
    final String rootMotionSource = source.substring(
      rootMotionStart,
      rootMotionEnd,
    );
    expect(rootMotionSource, contains('with WidgetsBindingObserver'));
    expect(rootMotionSource, contains('late bool _reduceMotion;'));
    expect(
      rootMotionSource,
      contains('WidgetsBinding.instance.addObserver(this);'),
    );
    expect(
      rootMotionSource,
      contains('_reduceMotion = WidgetsBinding.instance.disableAnimations;'),
    );
    expect(
      rootMotionSource,
      contains('void didChangeAccessibilityFeatures()'),
    );
    expect(
      rootMotionSource,
      contains('WidgetsBinding.instance.removeObserver(this);'),
    );
    expect(rootMotionSource, contains('themeAnimationDuration: _reduceMotion'));
    expect(
      rootMotionSource,
      isNot(
        contains(
          'themeAnimationDuration: const Duration(milliseconds: 300)',
        ),
      ),
    );
    expect(source, contains('if (!mounted || !_scroll.hasClients) return;'));
    expect(source, contains('_scroll.jumpTo(target);'));
    expect(
      source,
      contains(
        'duration: AppMotion.reduce(context)\n'
        '              ? Duration.zero\n'
        '              : const Duration(milliseconds: 180)',
      ),
    );
    expect(
      source,
      contains(
        'duration: AppMotion.reduce(context)\n'
        '            ? Duration.zero\n'
        '            : const Duration(milliseconds: 220)',
      ),
    );

'''
              tests = tests[:insertion_point] + guard + tests[insertion_point:]

          main_path.write_text(source)
          test_path.write_text(tests)
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format surgical scope
        run: dart format --language-version latest lib/main.dart test/ui_micro_aesthetics_test.dart

      - name: Verify accessibility and visual contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('lib/main.dart').read_text()
          tests = Path('test/ui_micro_aesthetics_test.dart').read_text()

          app_start = source.index('class _AarishDiaryAppState extends State<AarishDiaryApp>')
          app_end = source.index('class _RootStage extends StatelessWidget', app_start)
          app = source[app_start:app_end]
          for token in (
              'with WidgetsBindingObserver',
              'late bool _reduceMotion;',
              'WidgetsBinding.instance.addObserver(this);',
              '_reduceMotion = WidgetsBinding.instance.disableAnimations;',
              'void didChangeAccessibilityFeatures()',
              'WidgetsBinding.instance.removeObserver(this);',
              'themeAnimationDuration: _reduceMotion',
          ):
              if token not in app:
                  raise SystemExit(f'missing root accessibility contract: {token}')

          required = (
              'if (!mounted || !_scroll.hasClients) return;',
              '_scroll.jumpTo(target);',
              'duration: AppMotion.reduce(context)\n              ? Duration.zero\n              : const Duration(milliseconds: 180)',
              'duration: AppMotion.reduce(context)\n            ? Duration.zero\n            : const Duration(milliseconds: 220)',
              '..setEntry(3, 2, .00075)',
              '..rotateY(-delta * .018)',
              'offset: Offset(0, depth * 1.8)',
              'width: 84,',
              'height: 70,',
              'height: 88,',
          )
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f'missing hardened interaction contracts: {missing}')

          stale = (
              'themeAnimationDuration: const Duration(milliseconds: 300)',
              'if (_scroll.hasClients) {\n        _scroll.animateTo(',
              'AnimatedSwitcher(\n          duration: const Duration(milliseconds: 180)',
              'child: AnimatedContainer(\n        duration: const Duration(milliseconds: 220)',
          )
          present = [token for token in stale if token in source]
          if present:
              raise SystemExit(f'stale non-accessible motion remains: {present}')

          if 'Root, delayed-scroll and export motion honor live platform accessibility.' not in tests:
              raise SystemExit('missing accessibility regression guard')
          PY

      - name: Analyze
        run: flutter analyze

      - name: Run all tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Verify exact change scope
        shell: bash
        run: |
          git diff --exit-code -- pubspec.lock
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for file in "${changed[@]}"; do
            case "$file" in
              lib/main.dart|test/ui_micro_aesthetics_test.dart) ;;
              *) echo "Unexpected changed file: $file" >&2; exit 1 ;;
            esac
          done

      - name: Commit and push verified interaction hardening
        shell: bash
        run: |
          if git diff --quiet -- lib/main.dart test/ui_micro_aesthetics_test.dart; then
            echo "Accessibility and lifecycle contracts already satisfied; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart test/ui_micro_aesthetics_test.dart
          git commit -m "Harden premium motion accessibility and lifecycle"
          git push origin HEAD:main