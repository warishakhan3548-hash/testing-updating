name: Interaction Physics Surgeon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/interaction-physics-surgeon.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interaction-physics-surgeon-main
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply hyper-premium interaction upgrade
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main_path = Path('lib/main.dart')
          test_path = Path('test/premium_interaction_physics_test.dart')
          source = main_path.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          visual_sentinels = (
              'static const double cardRadius = 24;',
              'static const double heroRadius = 28;',
              'static const double sheetRadius = 36;',
              'const IconData premiumHomeIcon = Icons.space_dashboard_rounded;',
              'const IconData premiumExpenseIcon = Icons.shopping_bag_rounded;',
              'const IconData premiumDeleteIcon = Icons.delete_outline_rounded;',
              'width: 84,',
              'height: 70,',
              'height: 88,',
              'Color(0xFAFFFFFF), Color(0xF2FFFFFF)',
              'Color(0xF0121826), Color(0xE3080C18)',
          )
          before_visual = {token: source.count(token) for token in visual_sentinels}

          source = replace_once(
              source,
              '  static const Duration motion = Duration(milliseconds: 260);\n'
              '  static const Duration dashboardReveal = Duration(milliseconds: 520);',
              '  static const Duration motion = Duration(milliseconds: 260);\n'
              '  static const Duration navMotion = Duration(milliseconds: 220);\n'
              '  static const Duration dashboardReveal = Duration(milliseconds: 520);',
              'navigation motion token',
          )

          old_physics = '''class _LedgerPagePhysics extends PageScrollPhysics {
            const _LedgerPagePhysics({super.parent});

            static const SpringDescription _pageSettleSpring = SpringDescription(
              mass: .78,
              stiffness: 300,
              damping: 30,
            );

            @override
            _LedgerPagePhysics applyTo(ScrollPhysics? ancestor) =>
                _LedgerPagePhysics(parent: buildParent(ancestor));

            @override
            SpringDescription get spring => _pageSettleSpring;
          }'''

          new_physics = '''class _LedgerPagePhysics extends PageScrollPhysics {
            const _LedgerPagePhysics({super.parent});

            // Slightly under-critical: fast initial response, then one calm settle.
            // The actual finger release velocity is carried into the simulation.
            static const SpringDescription _pageSettleSpring = SpringDescription(
              mass: .86,
              stiffness: 360,
              damping: 33,
            );
            static const double _velocityProjectionSeconds = .10;
            static const double _maxProjectedPages = .22;
            static const double _flingCommitPagesPerSecond = .52;

            @override
            _LedgerPagePhysics applyTo(ScrollPhysics? ancestor) =>
                _LedgerPagePhysics(parent: buildParent(ancestor));

            @override
            SpringDescription get spring => _pageSettleSpring;

            @override
            Simulation? createBallisticSimulation(
              ScrollMetrics position,
              double velocity,
            ) {
              if (position.outOfRange ||
                  (velocity <= 0 && position.pixels <= position.minScrollExtent) ||
                  (velocity >= 0 && position.pixels >= position.maxScrollExtent)) {
                return super.createBallisticSimulation(position, velocity);
              }

              final double pageExtent = position.viewportDimension;
              if (!pageExtent.isFinite || pageExtent <= 0) {
                return super.createBallisticSimulation(position, velocity);
              }

              final Tolerance tolerance = toleranceFor(position);
              final double currentPage =
                  (position.pixels - position.minScrollExtent) / pageExtent;
              final double maxPage =
                  (position.maxScrollExtent - position.minScrollExtent) /
                  pageExtent;
              final double pageVelocity = velocity / pageExtent;
              final double projectedDelta =
                  (pageVelocity * _velocityProjectionSeconds)
                      .clamp(-_maxProjectedPages, _maxProjectedPages)
                      .toDouble();

              // A decisive fling advances at most one page. A slower release uses
              // a short velocity projection, so intent near the midpoint wins
              // without making tiny accidental drags switch modules.
              final double targetPage =
                  pageVelocity.abs() >= _flingCommitPagesPerSecond
                  ? (pageVelocity > 0
                        ? currentPage.floorToDouble() + 1
                        : currentPage.ceilToDouble() - 1)
                  : (currentPage + projectedDelta).roundToDouble();
              final double clampedPage = targetPage
                  .clamp(0.0, maxPage)
                  .toDouble();
              final double targetPixels =
                  (position.minScrollExtent + clampedPage * pageExtent)
                      .clamp(position.minScrollExtent, position.maxScrollExtent)
                      .toDouble();

              if ((targetPixels - position.pixels).abs() <= tolerance.distance &&
                  velocity.abs() <= tolerance.velocity) {
                return null;
              }

              return ScrollSpringSimulation(
                spring,
                position.pixels,
                targetPixels,
                velocity,
                tolerance: tolerance,
              );
            }
          }'''
          source = replace_once(source, old_physics, new_physics, 'ledger page physics')

          shell_start = source.index('class _AppShellState extends State<AppShell>')
          shell_end = source.index('class _KeepAlivePage extends StatefulWidget', shell_start)
          shell = source[shell_start:shell_end]
          if '_buildSwipeMotionPage' in shell:
              raise SystemExit('swipe motion stage already exists')

          build_marker = '  @override\n  Widget build(BuildContext context) {'
          helper = '''  Widget _buildSwipeMotionPage(int index, Widget child) => AnimatedBuilder(
            animation: _pageController,
            child: child,
            builder: (BuildContext context, Widget? stableChild) {
              final Widget pageChild = stableChild!;
              if (AppMotion.reduce(context) ||
                  !_pageController.hasClients ||
                  !_pageController.position.hasContentDimensions) {
                return pageChild;
              }

              final double page =
                  _pageController.page ?? _settledPage.toDouble();
              final double delta = (page - index).clamp(-1.0, 1.0).toDouble();
              final double depth = delta.abs();
              if (depth <= .0001) return pageChild;

              // Paint-only spatial response: no layout, color, icon, or card-size
              // mutation. The page follows the finger and returns to identity at rest.
              final Matrix4 transform = Matrix4.identity()
                ..setEntry(3, 2, .00075)
                ..rotateY(-delta * .018);
              return Transform(
                alignment: Alignment.center,
                transform: transform,
                child: Transform.translate(
                  offset: Offset(0, depth * 1.8),
                  child: pageChild,
                ),
              );
            },
          );

          '''
          marker_count = shell.count(build_marker)
          if marker_count != 1:
              raise SystemExit(
                  f'app shell build marker: expected 1 match, found {marker_count}'
              )
          shell = shell.replace(build_marker, helper + build_marker, 1)
          source = source[:shell_start] + shell + source[shell_end:]

          source = replace_once(
              source,
              '                  children: screens,',
              '''                  children: List<Widget>.generate(
                    screens.length,
                    (int index) => _buildSwipeMotionPage(index, screens[index]),
                  ),''',
              'page motion children',
          )

          source = replace_once(
              source,
              '    final Duration navMotion = AppMotion.reduce(context)\n'
              '        ? Duration.zero\n'
              '        : UIConstants.motion;',
              '    final Duration navMotion = AppMotion.reduce(context)\n'
              '        ? Duration.zero\n'
              '        : UIConstants.navMotion;',
              'bottom navigation timing',
          )

          after_visual = {token: source.count(token) for token in visual_sentinels}
          if before_visual != after_visual:
              changed = {
                  token: (before_visual[token], after_visual[token])
                  for token in visual_sentinels
                  if before_visual[token] != after_visual[token]
              }
              raise SystemExit(f'visual lock violated: {changed}')

          main_path.write_text(source)

          test_path.write_text('''import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('premium swipe physics preserve intent and visual lock', () {
              final String source = File('lib/main.dart').readAsStringSync();

              expect(
                source,
                contains('Duration navMotion = Duration(milliseconds: 220)'),
              );
              expect(source, contains('class _LedgerPagePhysics extends PageScrollPhysics'));
              expect(source, contains('_velocityProjectionSeconds = .10'));
              expect(source, contains('_maxProjectedPages = .22'));
              expect(source, contains('_flingCommitPagesPerSecond = .52'));
              expect(source, contains('Simulation? createBallisticSimulation('));
              expect(source, contains('final double pageVelocity = velocity / pageExtent'));
              expect(source, contains('currentPage.floorToDouble() + 1'));
              expect(source, contains('currentPage.ceilToDouble() - 1'));
              expect(source, contains('return ScrollSpringSimulation('));
              expect(source, contains('targetPixels,\n        velocity,'));

              expect(source, contains('Widget _buildSwipeMotionPage('));
              expect(source, contains('animation: _pageController'));
              expect(source, contains('AppMotion.reduce(context)'));
              expect(source, contains('..setEntry(3, 2, .00075)'));
              expect(source, contains('..rotateY(-delta * .018)'));
              expect(source, contains('offset: Offset(0, depth * 1.8)'));
              expect(source, contains('children: List<Widget>.generate('));

              // Resting geometry and semantic icon identity stay untouched.
              expect(source, contains('width: 84,'));
              expect(source, contains('height: 70,'));
              expect(source, contains('height: 88,'));
              expect(source, contains('const IconData premiumHomeIcon = Icons.space_dashboard_rounded;'));
              expect(source, contains('const IconData premiumExpenseIcon = Icons.shopping_bag_rounded;'));
              expect(source, contains('const IconData premiumDeleteIcon = Icons.delete_outline_rounded;'));
            });
          }
          ''')
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format surgical scope
        run: dart format --language-version latest lib/main.dart test/premium_interaction_physics_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run all tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Verify exact change scope
        shell: bash
        run: |
          git diff --exit-code -- pubspec.lock
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for file in "${changed[@]}"; do
            case "$file" in
              lib/main.dart|test/premium_interaction_physics_test.dart) ;;
              *) echo "Unexpected modified file: $file"; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -eq 2

      - name: Commit and push verified interaction upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart test/premium_interaction_physics_test.dart
          git commit -m "Upgrade premium swipe and navigation physics"
          git pull --rebase origin main
          git push origin HEAD:main
