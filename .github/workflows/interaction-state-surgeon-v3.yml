name: Interaction State Surgeon V3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/interaction-state-surgeon-v3.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch interaction state and touch physics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              path.write_text(source.replace(old, new, 1))

          main = Path('lib/main.dart')
          test = Path('test/ui_micro_aesthetics_test.dart')

          replace_once(
              main,
              """import 'package:flutter/foundation.dart';\nimport 'package:flutter/material.dart';\n""",
              """import 'package:flutter/foundation.dart';\nimport 'package:flutter/gestures.dart' show TapMoveDetails;\nimport 'package:flutter/material.dart';\n""",
              'tap move details import',
          )

          replace_once(
              main,
              """class _AppShellState extends State<AppShell> with WidgetsBindingObserver {\n  int _tab = 0;\n  int? _programmaticPageTarget;\n""",
              """class _AppShellState extends State<AppShell> with WidgetsBindingObserver {\n  int _tab = 0;\n  int _settledPage = 0;\n  int? _programmaticPageTarget;\n""",
              'app shell state split',
          )

          replace_once(
              main,
              """  void _selectTab(int index) {\n    if (index < 0 || index >= _tabs.length || _tab == index) return;\n\n    final bool reduceMotion = AppMotion.reduce(context);\n    setState(() => _tab = index);\n    _scrollNavigation(index);\n\n    if (!_pageController.hasClients) return;\n    if (reduceMotion) {\n      _programmaticPageTarget = null;\n      _pageController.jumpToPage(index);\n      return;\n    }\n\n    _programmaticPageTarget = index;\n    unawaited(\n      _pageController\n          .animateToPage(\n            index,\n            duration: UIConstants.motion,\n            curve: UIConstants.motionOut,\n          )\n          .whenComplete(() => _finishProgrammaticPageMotion(index)),\n    );\n  }\n\n  void _finishProgrammaticPageMotion(int target) {\n    if (!mounted || _programmaticPageTarget != target) return;\n    _programmaticPageTarget = null;\n    if (!_pageController.hasClients) return;\n\n    final double? page = _pageController.page;\n    if (page == null) return;\n    final int settledIndex = page.round().clamp(0, _tabs.length - 1).toInt();\n    if (settledIndex == _tab) return;\n    setState(() => _tab = settledIndex);\n    _scrollNavigation(settledIndex);\n  }\n\n  void _handlePageChanged(int index) {\n    // animateToPage can report every intermediate page. The selected tab is\n    // already the user's requested destination, so suppress those callbacks\n    // and their haptics until the driven motion settles.\n    if (_programmaticPageTarget != null) return;\n    if (_tab == index) return;\n    HapticFeedback.selectionClick();\n    setState(() => _tab = index);\n    _scrollNavigation(index);\n  }\n""",
              """  void _selectTab(int index) {\n    if (index < 0 || index >= _tabs.length || _tab == index) return;\n\n    final bool reduceMotion = AppMotion.reduce(context);\n    if (reduceMotion) {\n      _programmaticPageTarget = null;\n      setState(() {\n        _tab = index;\n        _settledPage = index;\n      });\n      _scrollNavigation(index);\n      if (_pageController.hasClients) _pageController.jumpToPage(index);\n      return;\n    }\n\n    setState(() => _tab = index);\n    _scrollNavigation(index);\n\n    if (!_pageController.hasClients) return;\n    _programmaticPageTarget = index;\n    unawaited(\n      _pageController\n          .animateToPage(\n            index,\n            duration: UIConstants.motion,\n            curve: UIConstants.motionOut,\n          )\n          .whenComplete(() => _finishProgrammaticPageMotion(index)),\n    );\n  }\n\n  void _finishProgrammaticPageMotion(int target) {\n    if (!mounted || _programmaticPageTarget != target) return;\n    _programmaticPageTarget = null;\n    if (!_pageController.hasClients) return;\n\n    final double? page = _pageController.page;\n    if (page == null) return;\n    final int settledIndex = page.round().clamp(0, _tabs.length - 1).toInt();\n    final bool selectionChanged = settledIndex != _tab;\n    final bool pageChanged = settledIndex != _settledPage;\n    if (!selectionChanged && !pageChanged) return;\n    setState(() {\n      _tab = settledIndex;\n      _settledPage = settledIndex;\n    });\n    if (selectionChanged) _scrollNavigation(settledIndex);\n  }\n\n  void _handlePageChanged(int index) {\n    // animateToPage can report every intermediate page. The selected tab is\n    // already the user's requested destination, so suppress those callbacks\n    // and their haptics until the driven motion settles.\n    if (_programmaticPageTarget != null) return;\n    if (_tab == index && _settledPage == index) return;\n    final bool selectionChanged = _tab != index;\n    if (selectionChanged) HapticFeedback.selectionClick();\n    setState(() {\n      _tab = index;\n      _settledPage = index;\n    });\n    if (selectionChanged) _scrollNavigation(index);\n  }\n""",
              'tab selection vs settled page state',
          )

          source = main.read_text()
          active_count = source.count('active: _tab ==')
          if active_count != 7:
              raise SystemExit(f'active page bindings: expected 7, found {active_count}')
          main.write_text(source.replace('active: _tab ==', 'active: _settledPage =='))

          replace_once(
              main,
              """  @override\n  void didUpdateWidget(covariant _Pressable oldWidget) {\n    super.didUpdateWidget(oldWidget);\n    if (oldWidget.onTap != null && widget.onTap == null) {\n      _pressController.stop();\n      _pressController.value = 0;\n    }\n  }\n\n  void _captureTouch(TapDownDetails details) {\n    final RenderBox? box = context.findRenderObject() as RenderBox?;\n    if (box == null || !box.hasSize || box.size.isEmpty) return;\n    final double x = (details.localPosition.dx / box.size.width * 2 - 1)\n        .clamp(-.72, .72)\n        .toDouble();\n    final double y = (details.localPosition.dy / box.size.height * 2 - 1)\n        .clamp(-.72, .72)\n        .toDouble();\n    _touchAlignment = Alignment(x, y);\n  }\n""",
              """  @override\n  void didUpdateWidget(covariant _Pressable oldWidget) {\n    super.didUpdateWidget(oldWidget);\n    final bool interactionDisabled =\n        (oldWidget.onTap != null && widget.onTap == null) ||\n        (oldWidget.animatePress && !widget.animatePress);\n    if (interactionDisabled) _resetPressFeedback();\n  }\n\n  void _resetPressFeedback() {\n    _pressController.stop();\n    if (_pressController.value != 0) _pressController.value = 0;\n    _touchAlignment = Alignment.center;\n  }\n\n  bool _updateTouchAlignment(Offset localPosition) {\n    final RenderBox? box = context.findRenderObject() as RenderBox?;\n    if (box == null || !box.hasSize || box.size.isEmpty) return false;\n    final double x = (localPosition.dx / box.size.width * 2 - 1)\n        .clamp(-.72, .72)\n        .toDouble();\n    final double y = (localPosition.dy / box.size.height * 2 - 1)\n        .clamp(-.72, .72)\n        .toDouble();\n    final Alignment nextAlignment = Alignment(x, y);\n    if (nextAlignment == _touchAlignment) return false;\n    _touchAlignment = Alignment(x, y);\n    return true;\n  }\n\n  void _captureTouch(TapDownDetails details) {\n    _updateTouchAlignment(details.localPosition);\n  }\n\n  void _trackTouch(TapMoveDetails details) {\n    if (widget.onTap == null || !widget.animatePress) return;\n    final bool changed = _updateTouchAlignment(details.localPosition);\n    if (changed && !_pressController.isAnimating && mounted) setState(() {});\n  }\n""",
              'press state reset and touch tracking',
          )

          replace_once(
              main,
              """      onTapDown: widget.onTap == null || !widget.animatePress ? null : _press,\n      onTapCancel: widget.onTap == null || !widget.animatePress\n""",
              """      onTapDown: widget.onTap == null || !widget.animatePress ? null : _press,\n      onTapMove: widget.onTap == null || !widget.animatePress\n          ? null\n          : _trackTouch,\n      onTapCancel: widget.onTap == null || !widget.animatePress\n""",
              'tap move tracking hook',
          )

          replace_once(
              test,
              """    expect(source, contains('oldWidget.onTap != null && widget.onTap == null'));\n    expect(source, contains('this.feedbackColor'));\n""",
              """    expect(source, contains('oldWidget.onTap != null && widget.onTap == null'));\n    expect(source, contains('oldWidget.animatePress && !widget.animatePress'));\n    expect(source, contains('void _resetPressFeedback()'));\n    expect(source, contains('bool _updateTouchAlignment(Offset localPosition)'));\n    expect(source, contains('void _trackTouch(TapMoveDetails details)'));\n    expect(source, contains('onTapMove:'));\n    expect(source, contains(': _trackTouch,'));\n    expect(source, contains('this.feedbackColor'));\n""",
              'press robustness regression checks',
          )

          replace_once(
              test,
              """    expect(source, contains('int? _programmaticPageTarget;'));\n    expect(source, contains('if (_programmaticPageTarget != null) return;'));\n    expect(source, contains('_finishProgrammaticPageMotion(index)'));\n""",
              """    expect(source, contains('int _settledPage = 0;'));\n    expect(source, contains('int? _programmaticPageTarget;'));\n    expect(source, contains('if (_programmaticPageTarget != null) return;'));\n    expect(source, contains('_finishProgrammaticPageMotion(index)'));\n    expect(\n      RegExp(r'active: _settledPage ==').allMatches(source),\n      hasLength(7),\n    );\n    expect(source, isNot(contains('active: _tab ==')));\n""",
              'settled page regression checks',
          )
          PY

      - name: Remove temporary surgeons
        run: rm .github/workflows/interaction-state-surgeon.yml .github/workflows/interaction-state-surgeon-v2.yml .github/workflows/interaction-state-surgeon-v3.yml

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format patch
        run: dart format --language-version latest lib/main.dart test/ui_micro_aesthetics_test.dart

      - name: Verify formatting
        run: dart format --language-version latest --output=none --set-exit-if-changed lib/main.dart test/ui_micro_aesthetics_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Stage and validate diff
        shell: bash
        run: |
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/interaction-state-surgeon-v3.yml' '.github/workflows/interaction-state-surgeon-v2.yml' '.github/workflows/interaction-state-surgeon.yml' 'lib/main.dart' 'test/ui_micro_aesthetics_test.dart' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected staged files:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          git diff --cached --stat

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ui: synchronize navigation and press interaction state"
          git push origin HEAD:main
