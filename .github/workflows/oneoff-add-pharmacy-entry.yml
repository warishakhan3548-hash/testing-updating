name: One-off Add Pharmacy Entry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-add-pharmacy-entry.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply pharmacy entry patch
        run: python3 .github/patch_add_pharmacy_entry.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format
        run: dart format lib/main.dart

      - name: Pharmacy UI guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('lib/main.dart').read_text(encoding='utf-8')
          dash = src[src.index('class DashboardScreen'):src.index('class _SyncPill')]
          for token in [
              "'Party Ledger'",
              "'Enter in Pharmacy'",
              "'PHARMACY MEDICATIONS'",
              'Icons.medication_rounded',
              'PharmacyDashboardPlaceholderScreen',
              'childAspectRatio: 1.0',
          ]:
              assert token in dash, token
          assert src.count('class PharmacyDashboardPlaceholderScreen') == 1
          print('PHARMACY_UI_OK')
          PY

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Diff scope guard
        run: |
          git diff -- lib/main.dart > /tmp/pharmacy-entry.diff
          python3 - <<'PY'
          from pathlib import Path
          d = Path('/tmp/pharmacy-entry.diff').read_text(encoding='utf-8')
          for token in ['Enter in Pharmacy', 'PHARMACY MEDICATIONS', 'PharmacyDashboardPlaceholderScreen']:
              if token not in d:
                  raise SystemExit(f'Expected pharmacy delta missing: {token}')
          forbidden = [
              'firebase_sync.dart', 'LedgerMath.dashboard',
              "label: 'To Receive (+)'", "label: 'To Pay (-)'",
              "label: 'Month Expense'", "label: 'Month Profit'",
              'class BusinessScreen', 'class CreditScreen',
              'class SalaryScreen', 'class DiaryScreen',
          ]
          for token in forbidden:
              if token in d:
                  raise SystemExit(f'Forbidden unrelated scope touched: {token}')
          print('SCOPE_OK')
          PY

      - name: Commit verified pharmacy entry
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add Enter in Pharmacy dashboard entry
          file_pattern: lib/main.dart
