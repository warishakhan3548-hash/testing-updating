name: One-off Premium Visual Polish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-premium-visual-polish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply guarded premium visual polish
        run: python3 .github/premium_visual_polish.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aarish-diary-debug-keystore-v1

      - name: Resolve packages
        run: flutter pub get

      - name: Format
        run: dart format lib/main.dart

      - name: Analyze
        run: flutter analyze

      - name: Test ledger invariants
        run: flutter test

      - name: Commit verified premium visual polish
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Refine card hierarchy and navigation polish [skip ci]
          file_pattern: lib/main.dart pubspec.yaml

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aarish-diary-v1.0.6-premium-polish-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
