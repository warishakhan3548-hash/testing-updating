name: Apply motion delight upgrade

on:
  push:
    branches: [main]
    paths:
      - "tool/apply_motion_delight_upgrade.dart"
      - ".github/workflows/apply-motion-delight.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Apply guarded Dart motion upgrade
        run: dart run tool/apply_motion_delight_upgrade.dart

      - name: Commit upgraded interaction physics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Upgrade touch motion and refresh delight"
          git push
