name: Curved Accent Strip UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/curved-accent-strip.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch curved accent strip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          start = s.index('class _GlassCard extends StatelessWidget {')
          tail = s[start:]
          end = tail.index('\n}\n', tail.index('Widget build(BuildContext context)')) + 3
          block = tail[:end]

          old_border = '''    final Border border = accentColor == null
        ? Border.all(color: borderColor ?? surfaceBorder)
        : Border(
            left: BorderSide(color: accentColor!, width: 4),
            top: BorderSide(color: surfaceBorder),
            right: BorderSide(
              color: dark
                  ? Colors.white.withAlpha(20)
                  : Colors.white.withAlpha(92),
            ),
            bottom: BorderSide(
              color: dark
                  ? Colors.black.withAlpha(97)
                  : Colors.white.withAlpha(66),
            ),
          );'''
          new_border = '''    final Border border = Border.all(
      color: borderColor ?? surfaceBorder,
    );'''
          if old_border not in block:
              raise SystemExit('old accent border not found')
          block = block.replace(old_border, new_border, 1)

          old_return = '''    return Container(
      padding: padding,
      decoration: BoxDecoration(
        gradient: LinearGradient(
          begin: Alignment.topLeft,
          end: Alignment.bottomRight,
          colors: surfaceColors,
        ),
        borderRadius: BorderRadius.circular(borderRadius),
        border: border,
        boxShadow: shadows,
      ),
      child: child,
    );'''
          new_return = '''    return Container(
      clipBehavior: Clip.antiAlias,
      decoration: BoxDecoration(
        gradient: LinearGradient(
          begin: Alignment.topLeft,
          end: Alignment.bottomRight,
          colors: surfaceColors,
        ),
        borderRadius: BorderRadius.circular(borderRadius),
        border: border,
        boxShadow: shadows,
      ),
      child: Stack(
        children: <Widget>[
          if (accentColor != null)
            Positioned(
              left: 0,
              top: 0,
              bottom: 0,
              width: 6,
              child: DecoratedBox(
                decoration: BoxDecoration(
                  color: accentColor,
                  boxShadow: <BoxShadow>[
                    BoxShadow(
                      color: accentColor!.withAlpha(dark ? 92 : 72),
                      blurRadius: 16,
                      offset: const Offset(3, 0),
                    ),
                  ],
                ),
              ),
            ),
          Padding(
            padding: padding,
            child: child,
          ),
        ],
      ),
    );'''
          if old_return not in block:
              raise SystemExit('old glass card return not found')
          block = block.replace(old_return, new_return, 1)
          s = s[:start] + block + tail[end:]
          p.write_text(s)
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/main.dart
      - run: flutter analyze
      - run: flutter test
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Curve module card accent strips
          file_pattern: lib/main.dart
