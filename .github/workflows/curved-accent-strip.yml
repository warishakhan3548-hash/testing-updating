name: Curved Accent Strip UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/curved-accent-strip.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/curved_accent_patch.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/main.dart
      - run: flutter analyze
      - run: flutter test
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Curve module card accent strips
          file_pattern: lib/main.dart
