name: Invisible Ripple Rebuild Surgeon V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/invisible-ripple-rebuild-surgeon-v2.yml"

permissions:
  contents: write

concurrency:
  group: invisible-ripple-rebuild-main-v2
  cancel-in-progress: false

jobs:
  patch-analyze-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Apply audited ripple patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EXTRACT'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/invisible-ripple-rebuild-surgeon.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/ripple_patch.py').write_text(script, encoding='utf-8')
          EXTRACT
          python3 /tmp/ripple_patch.py

      - name: Resolve packages
        run: flutter pub get

      - name: Format surgical files
        run: dart format lib/main.dart test/global_tap_ripple_intent_test.dart

      - name: Flutter analyze
        run: flutter analyze --fatal-infos

      - name: Commit and push immediately after analyze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "warishakhan3548-hash"
          git config user.email "warishakhan3548-hash@users.noreply.github.com"

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git rebase --autostash origin/main
            flutter analyze --fatal-infos
          fi

          git rm -- .github/workflows/invisible-ripple-rebuild-surgeon.yml
          git rm -- .github/workflows/invisible-ripple-rebuild-surgeon-v2.yml
          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "Eliminate invisible ripple rebuilds"
          git push origin HEAD:main
