name: Inspect Card Layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-card-layout.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print relevant layout code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          lines = p.read_text(encoding='utf-8').splitlines()
          needles = [
              'class DashboardScreen',
              'class _MetricCard',
              'class BusinessScreen',
              "tone.label",
              "All Entries",
              "2 Records Logged",
              "Records Logged",
          ]
          hits = []
          for i, line in enumerate(lines, 1):
              if any(n in line for n in needles):
                  hits.append(i)
          print('HITS', hits)
          ranges = []
          for i in hits:
              ranges.append((max(1, i-90), min(len(lines), i+180)))
          merged=[]
          for a,b in sorted(ranges):
              if not merged or a > merged[-1][1]+1:
                  merged.append([a,b])
              else:
                  merged[-1][1]=max(merged[-1][1],b)
          for a,b in merged:
              print(f'\n===== LINES {a}-{b} =====')
              for n in range(a,b+1):
                  print(f'{n:05d}: {lines[n-1]}')
          PY
