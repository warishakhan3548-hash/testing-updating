name: Remove Redundant Business Header Add

on:
  push:
    paths:
      - '.github/workflows/remove-redundant-business-header-add.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove only the redundant header add action
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')

          old = '''              actions: <Widget>[\n                _CircleAction(\n                  icon: Icons.add_rounded,\n                  onTap: () => unawaited(_addEntry(context)),\n                ),\n                _DeleteActionButton(\n                  padding: const EdgeInsets.only(left: 6),\n                  semanticLabel: 'Delete business account',\n                  onTap: () => unawaited(_deleteProject(context)),\n                ),\n              ],'''

          new = '''              actions: <Widget>[\n                _DeleteActionButton(\n                  padding: const EdgeInsets.only(left: 6),\n                  semanticLabel: 'Delete business account',\n                  onTap: () => unawaited(_deleteProject(context)),\n                ),\n              ],'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one business header add block, found {count}')

          text = text.replace(old, new, 1)

          # Protect the lower Add Entry control: it must still exist exactly as before.
          lower_entry = '''                      _MiniAction(\n                        label: 'Entry',\n                        icon: Icons.add_rounded,\n                        color: appleBlue,\n                        onTap: () => unawaited(_addEntry(context)),\n                      ),'''
          if lower_entry not in text:
              raise SystemExit('Lower + Entry action is missing; refusing to write')

          # Protect delete action.
          if "semanticLabel: 'Delete business account'" not in text:
              raise SystemExit('Business delete action is missing; refusing to write')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Diff sanity check only
        shell: bash
        run: |
          git diff --check
          git diff -- lib/main.dart
          test "$(git diff --numstat -- lib/main.dart | awk '{print $1+$2}')" = "4"

      - name: Commit surgical fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git commit -m 'fix: remove redundant business header add [skip ci]'
          git push origin HEAD:main
