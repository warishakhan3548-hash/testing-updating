name: Quick Expense Share Ripple

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/quick-expense-ripple.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch expense share ripple only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/main.dart')
          s = p.read_text()

          old_action = """            _CircleAction(\n              icon: Icons.share_rounded,\n              color: appleBlue,\n              semanticLabel: 'Share this month expenses',\n              onTap: () => unawaited(_shareCurrentMonthExpenses()),\n            ),"""
          new_action = """            _ExpenseShareRippleAction(\n              onTap: () => unawaited(_shareCurrentMonthExpenses()),\n            ),"""

          if s.count(old_action) != 1:
              raise SystemExit(f'Expected one expense share action, found {s.count(old_action)}')

          anchor = """class ExpenseScreen extends StatefulWidget {\n"""
          if s.count(anchor) != 1:
              raise SystemExit(f'Expected one ExpenseScreen anchor, found {s.count(anchor)}')

          widget_code = """class _ExpenseShareRippleAction extends StatefulWidget {\n  const _ExpenseShareRippleAction({required this.onTap});\n\n  final VoidCallback onTap;\n\n  @override\n  State<_ExpenseShareRippleAction> createState() =>\n      _ExpenseShareRippleActionState();\n}\n\nclass _ExpenseShareRippleActionState extends State<_ExpenseShareRippleAction>\n    with SingleTickerProviderStateMixin {\n  late final AnimationController _ripple = AnimationController(\n    vsync: this,\n    duration: const Duration(milliseconds: 200),\n  );\n\n  @override\n  void dispose() {\n    _ripple.dispose();\n    super.dispose();\n  }\n\n  void _startRipple(PointerDownEvent event) {\n    if (AppMotion.reduce(context)) return;\n    _ripple.forward(from: 0);\n  }\n\n  @override\n  Widget build(BuildContext context) => Listener(\n    behavior: HitTestBehavior.translucent,\n    onPointerDown: _startRipple,\n    child: AnimatedBuilder(\n      animation: _ripple,\n      child: _CircleAction(\n        icon: Icons.share_rounded,\n        color: appleBlue,\n        semanticLabel: 'Share this month expenses',\n        onTap: widget.onTap,\n      ),\n      builder: (BuildContext context, Widget? child) {\n        final double t = _ripple.value;\n        final double wave = Curves.easeOutCubic.transform(t);\n        final double visibility = _ripple.isDismissed ? 0 : 1 - t;\n        final double press = math.sin(math.pi * t);\n        return Stack(\n          alignment: Alignment.center,\n          clipBehavior: Clip.none,\n          children: <Widget>[\n            Transform.scale(scale: 1 - press * .03, child: child),\n            IgnorePointer(\n              child: Opacity(\n                opacity: visibility.clamp(0.0, 1.0),\n                child: Transform.scale(\n                  scale: .44 + wave * .56,\n                  child: Container(\n                    width: UIConstants.minTapTarget,\n                    height: UIConstants.minTapTarget,\n                    decoration: BoxDecoration(\n                      shape: BoxShape.circle,\n                      color: appleBlue.withAlpha(18),\n                      border: Border.all(\n                        color: appleBlue.withAlpha(82),\n                        width: 1.35,\n                      ),\n                      boxShadow: <BoxShadow>[\n                        BoxShadow(\n                          color: appleBlue.withAlpha(24),\n                          blurRadius: 8,\n                          spreadRadius: -2,\n                        ),\n                      ],\n                    ),\n                  ),\n                ),\n              ),\n            ),\n          ],\n        );\n      },\n    ),\n  );\n}\n\n"""

          s = s.replace(old_action, new_action, 1)
          s = s.replace(anchor, widget_code + anchor, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- lib/main.dart

      - name: Commit exact ripple change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "ui: add 200ms expense share ripple"
          git push origin HEAD:main
