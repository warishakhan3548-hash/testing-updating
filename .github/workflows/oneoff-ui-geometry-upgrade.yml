name: One-off UI Geometry Upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-ui-geometry-upgrade.yml"

permissions:
  contents: write

jobs:
  upgrade-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded UI geometry transformation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/main.dart')
          code = path.read_text(encoding='utf-8')
          original = code

          def once(old: str, new: str, label: str) -> None:
              global code
              count = code.count(old)
              if count != 1:
                  raise SystemExit(f'SAFETY STOP: {label}: expected 1 match, found {count}')
              code = code.replace(old, new, 1)

          def all_matches(old: str, new: str, label: str, minimum: int = 1) -> None:
              global code
              count = code.count(old)
              if count < minimum:
                  raise SystemExit(f'SAFETY STOP: {label}: expected >= {minimum}, found {count}')
              code = code.replace(old, new)
              print(f'{label}: {count}')

          once(
          '''abstract final class UIConstants {
            static const double minTapTarget = 48;
            static const double inputRadius = 20;
            static const double compactRadius = 18;
            static const double actionRadius = 22;
            static const double cardRadius = 26;
            static const double heroRadius = 28;
            static const double sheetRadius = 36;
            static const double accentStroke = 6;
            static const double borderWidth = 1;

            static const EdgeInsets cardPadding = EdgeInsets.all(18);
            static const EdgeInsets compactCardPadding = EdgeInsets.all(15);
            static const EdgeInsets inputPadding =
                EdgeInsets.symmetric(horizontal: 20, vertical: 18);
            static const EdgeInsets actionPadding = EdgeInsets.symmetric(horizontal: 22);

            static const Duration motion = Duration(milliseconds: 280);
          }''',
          '''abstract final class UIConstants {
            static const double minTapTarget = 48;
            static const double compactButtonHeight = 48;
            static const double standardButtonHeight = 56;
            static const double inputRadius = 16;
            static const double compactRadius = 16;
            static const double actionRadius = 20;
            static const double cardRadius = 24;
            static const double heroRadius = 24;
            static const double sheetRadius = 32;
            static const double accentStroke = 6;
            static const double borderWidth = 1;

            static const EdgeInsets cardPadding = EdgeInsets.all(20);
            static const EdgeInsets compactCardPadding = EdgeInsets.all(16);
            static const EdgeInsets inputPadding =
                EdgeInsets.symmetric(horizontal: 20, vertical: 16);
            static const EdgeInsets actionPadding = EdgeInsets.symmetric(horizontal: 20);
            static const EdgeInsets screenPadding = EdgeInsets.fromLTRB(20, 8, 20, 32);

            static const Duration motion = Duration(milliseconds: 280);
          }''',
          'UIConstants geometry tokens')

          once(
              'final double target = math.max(0, index * 82 - 120).toDouble();',
              'final double target = math.max(0, index * 88 - 120).toDouble();',
              'bottom navigation scroll geometry')

          once('''          height: 88,
          child: SingleChildScrollView(''',
               '''          height: 80,
          child: SingleChildScrollView(''',
               'bottom navigation outer height')
          once('''                        width: 82,
                        height: 74,
                        margin: const EdgeInsets.symmetric(horizontal: 2),''',
               '''                        width: 80,
                        height: 64,
                        margin: const EdgeInsets.symmetric(horizontal: 4),''',
               'bottom navigation item geometry')
          once('''                                spec.icon,
                                size: 27,
                                color: active ? color : systemGray,''',
               '''                                spec.icon,
                                size: 24,
                                color: active ? color : systemGray,''',
               'bottom navigation icon size')
          once('''                                fontWeight:
                                    active ? FontWeight.w900 : FontWeight.w700,''',
               '''                                fontWeight:
                                    active ? FontWeight.w800 : FontWeight.w600,''',
               'bottom navigation label hierarchy')
          once('''                              width: active ? 38 : 0,
                              height: 4,''',
               '''                              width: active ? 40 : 0,
                              height: 4,''',
               'bottom navigation indicator')

          once('''          padding: const EdgeInsets.fromLTRB(24, 14, 20, 16),
          child: Row(''',
               '''          padding: const EdgeInsets.fromLTRB(20, 16, 20, 16),
          child: Row(''',
               'screen header alignment')
          once('''                leading!,
                const SizedBox(width: 11),''',
               '''                leading!,
                const SizedBox(width: 12),''',
               'screen header leading gap')
          once('''                        fontSize: leading == null ? 30 : 26,
                        fontWeight: FontWeight.w900,
                        letterSpacing: -.5,''',
               '''                        fontSize: leading == null ? 28 : 24,
                        fontWeight: FontWeight.w800,
                        letterSpacing: -.4,''',
               'screen title hierarchy')
          once('''                                fontSize: 10,
                                fontWeight: FontWeight.w900,
                                letterSpacing: 1.1,''',
               '''                                fontSize: 10,
                                fontWeight: FontWeight.w700,
                                letterSpacing: 1.0,''',
               'screen subtitle hierarchy')

          once('''            width: 50,
            height: 50,
            decoration: BoxDecoration(
              color: color.withAlpha(23),''',
               '''            width: 48,
            height: 48,
            decoration: BoxDecoration(
              color: color.withAlpha(23),''',
               'circle action tap target')
          once('''        borderRadius: BorderRadius.circular(25),
        child: Container(
          width: 50,
          height: 50,''',
               '''        borderRadius: BorderRadius.circular(24),
        child: Container(
          width: 48,
          height: 48,''',
               'back action geometry')

          once('''        color: widget.color,
        fontSize: 16,
        fontWeight: FontWeight.w800,
        shadows: AppStyles.inkGlow(widget.color),''',
               '''        color: widget.color,
        fontSize: 16,
        fontWeight: FontWeight.w700,
        shadows: AppStyles.inkGlow(widget.color),''',
               'search input text hierarchy')
          once('''        contentPadding:
            const EdgeInsets.symmetric(horizontal: 20, vertical: 19),''',
               '''        contentPadding:
            const EdgeInsets.symmetric(horizontal: 20, vertical: 16),''',
               'search input density')
          once('''          color: widget.color.withAlpha(160),
          fontSize: 16,
          fontWeight: FontWeight.w800,''',
               '''          color: widget.color.withAlpha(160),
          fontSize: 16,
          fontWeight: FontWeight.w600,''',
               'search hint hierarchy')
          once('prefixIconConstraints: const BoxConstraints(minWidth: 54),',
               'prefixIconConstraints: const BoxConstraints(minWidth: 48),',
               'search icon proportion')

          once('''          height: compact ? 52 : 58,
          padding: UIConstants.actionPadding,''',
               '''          height: compact
              ? UIConstants.compactButtonHeight
              : UIConstants.standardButtonHeight,
          padding: UIConstants.actionPadding,''',
               'primary button heights')
          once('''                  fontSize: compact ? 15.5 : 17,
                  fontWeight: FontWeight.w900,
                  shadows: AppStyles.inkGlow(foregroundColor),''',
               '''                  fontSize: compact ? 15 : 16.5,
                  fontWeight: FontWeight.w800,
                  shadows: AppStyles.inkGlow(foregroundColor),''',
               'primary button typography')

          once('''      padding: const EdgeInsets.all(22),
      decoration: BoxDecoration(
        gradient: LinearGradient(''',
               '''      padding: const EdgeInsets.all(20),
      decoration: BoxDecoration(
        gradient: LinearGradient(''',
               'amount hero padding')
          once('''              fontSize: 10,
              fontWeight: FontWeight.w900,
              letterSpacing: .8,
              shadows: <Shadow>[
                Shadow(color: glow.withAlpha(78), blurRadius: 12),
              ],
            ),
          ),
          const SizedBox(height: 5),
          Text(
            value,
            maxLines: 1,
            overflow: TextOverflow.ellipsis,
            style: TextStyle(
              color: color,
              fontSize: 31,
              fontWeight: FontWeight.w900,''',
               '''              fontSize: 11,
              fontWeight: FontWeight.w600,
              letterSpacing: .8,
              shadows: <Shadow>[
                Shadow(color: glow.withAlpha(78), blurRadius: 12),
              ],
            ),
          ),
          const SizedBox(height: 4),
          Text(
            value,
            maxLines: 1,
            overflow: TextOverflow.ellipsis,
            style: TextStyle(
              color: color,
              fontSize: 32,
              fontWeight: FontWeight.w700,''',
               'hero typography hierarchy')

          once('''  Widget build(BuildContext context) => Padding(
        padding: const EdgeInsets.only(bottom: 14),
        child: _Pressable(
          onTap: onTap,
          borderRadius: BorderRadius.circular(UIConstants.cardRadius),''',
               '''  Widget build(BuildContext context) => Padding(
        padding: const EdgeInsets.only(bottom: 12),
        child: _Pressable(
          onTap: onTap,
          borderRadius: BorderRadius.circular(UIConstants.cardRadius),''',
               'list card rhythm')
          once('''                Container(
                  width: 48,
                  height: 48,
                  decoration: BoxDecoration(
                    color: color.withAlpha(29),''',
               '''                Container(
                  width: 44,
                  height: 44,
                  decoration: BoxDecoration(
                    color: color.withAlpha(29),''',
               'list avatar geometry')
          once('''                          icon,
                          color: color,
                          size: 22,
                          shadows: AppStyles.inkGlow(color),''',
               '''                          icon,
                          color: color,
                          size: 20,
                          shadows: AppStyles.inkGlow(color),''',
               'list avatar icon size')
          once('''                              color: color,
                              fontSize: 18,
                              fontWeight: FontWeight.w900,
                              shadows: AppStyles.inkGlow(color),''',
               '''                              color: color,
                              fontSize: 18,
                              fontWeight: FontWeight.w800,
                              shadows: AppStyles.inkGlow(color),''',
               'list avatar letter weight')
          once('''                const SizedBox(width: 15),
                Expanded(
                  child: Column(''',
               '''                const SizedBox(width: 16),
                Expanded(
                  child: Column(''',
               'list card horizontal rhythm')
          once('''                          color: color,
                          fontSize: 16.5,
                          fontWeight: FontWeight.w900,
                          shadows: AppStyles.inkGlow(color),''',
               '''                          color: color,
                          fontSize: 16,
                          fontWeight: FontWeight.w700,
                          shadows: AppStyles.inkGlow(color),''',
               'list title hierarchy')
          once('''                          color: color.withAlpha(190),
                          fontSize: 13,
                          fontWeight: FontWeight.w800,''',
               '''                          color: color.withAlpha(190),
                          fontSize: 13,
                          fontWeight: FontWeight.w600,''',
               'list subtitle hierarchy')
          once('''                      color: color,
                      fontSize: 15.5,
                      fontWeight: FontWeight.w900,
                      shadows: AppStyles.inkGlow(color),''',
               '''                      color: color,
                      fontSize: 16,
                      fontWeight: FontWeight.w700,
                      shadows: AppStyles.inkGlow(color),''',
               'list trailing amount hierarchy')
          once('''                  fontSize: 18,
                  fontWeight: FontWeight.w900,
                  letterSpacing: -.2,''',
               '''                  fontSize: 18,
                  fontWeight: FontWeight.w800,
                  letterSpacing: -.2,''',
               'section title hierarchy')

          once('contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 17),',
               'contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 16),',
               'picker density')
          once('''                  width: 54,
                  height: 6,
                  decoration: BoxDecoration(''',
               '''                  width: 40,
                  height: 4,
                  decoration: BoxDecoration(''',
               'sheet handle geometry')
          once('''              const SizedBox(height: 26),
              Text(
                title,
                textAlign: centerTitle ? TextAlign.center : TextAlign.start,
                style: const TextStyle(
                  fontSize: 30,
                  fontWeight: FontWeight.w900,
                  letterSpacing: -.5,''',
               '''              const SizedBox(height: 24),
              Text(
                title,
                textAlign: centerTitle ? TextAlign.center : TextAlign.start,
                style: const TextStyle(
                  fontSize: 24,
                  fontWeight: FontWeight.w800,
                  letterSpacing: -.4,''',
               'sheet title hierarchy')

          once('''      borderRadius: BorderRadius.circular(22),
      child: Container(
        constraints: const BoxConstraints(
          minHeight: 62,
          minWidth: UIConstants.minTapTarget,
        ),
        padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 14),''',
               '''      borderRadius: BorderRadius.circular(UIConstants.actionRadius),
      child: Container(
        constraints: const BoxConstraints(
          minHeight: 56,
          minWidth: UIConstants.minTapTarget,
        ),
        padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),''',
               'role button geometry')
          once('''          borderRadius: BorderRadius.circular(22),
          border: Border.all(
            color: dark ? Colors.white.withAlpha(34) : color.withAlpha(95),''',
               '''          borderRadius: BorderRadius.circular(UIConstants.actionRadius),
          border: Border.all(
            color: dark ? Colors.white.withAlpha(34) : color.withAlpha(95),''',
               'role button radius')
          once('''                    fontSize: 17,
                    fontWeight: FontWeight.w900,
                    letterSpacing: -.25,''',
               '''                    fontSize: 16.5,
                    fontWeight: FontWeight.w800,
                    letterSpacing: -.2,''',
               'role button typography')

          # Shared table density: preserve columns and semantics, improve rhythm.
          all_matches('borderRadius: BorderRadius.circular(25),',
                      'borderRadius: BorderRadius.circular(UIConstants.cardRadius),',
                      'table card radius', 2)
          all_matches('const BoxConstraints(minHeight: 58)',
                      'const BoxConstraints(minHeight: 48)',
                      'table header height', 1)
          all_matches('height: 58,', 'height: 48,', 'milk table header height', 1)
          all_matches('constraints: BoxConstraints(minHeight: compact ? 78 : 84)',
                      'constraints: const BoxConstraints(minHeight: 72)',
                      'ledger table row height', 1)
          all_matches('constraints: const BoxConstraints(minHeight: 88)',
                      'constraints: const BoxConstraints(minHeight: 72)',
                      'milk table row height', 1)
          all_matches('fontWeight: FontWeight.w900,',
                      'fontWeight: FontWeight.w700,',
                      'remaining dense-table/display heavy weights', 1)

          # Normalize common vertical spacers to a 4/8-point rhythm.
          all_matches('const SizedBox(height: 13)', 'const SizedBox(height: 12)', '13-to-12 spacing')
          all_matches('const SizedBox(height: 22)', 'const SizedBox(height: 24)', '22-to-24 spacing')
          all_matches('const SizedBox(height: 23)', 'const SizedBox(height: 24)', '23-to-24 spacing')
          all_matches('const SizedBox(height: 18)', 'const SizedBox(height: 16)', '18-to-16 spacing')

          # Main scrolling bodies already sit above Scaffold.bottomNavigationBar;
          # use compact 32px tail breathing room instead of artificial 100+px gaps.
          for old in (
              'const EdgeInsets.fromLTRB(20, 8, 20, 30)',
              'const EdgeInsets.fromLTRB(20, 9, 20, 30)',
              'const EdgeInsets.fromLTRB(20, 8, 20, 32)',
              'const EdgeInsets.fromLTRB(20, 8, 20, 28)',
              'const EdgeInsets.fromLTRB(20, 10, 20, 34)',
          ):
              code = code.replace(old, 'UIConstants.screenPadding')

          if code == original:
              raise SystemExit('SAFETY STOP: no UI changes produced')
          path.write_text(code, encoding='utf-8')
          print('Guarded UI geometry transformation complete.')
          PY

      - name: Verify scope lock before formatting
        run: |
          git diff --check
          if git diff --unified=0 -- lib/main.dart | grep -E '^[+-].*(Color\(|appleBlue|appleGreen|semanticRed|appleRed|gradient:|Firebase|LedgerMath|sync\.write|_businessTones)'; then
            echo "Scope violation: color/theme/backend logic changed."
            exit 1
          fi
          grep -q "static const double compactButtonHeight = 48;" lib/main.dart
          grep -q "static const double standardButtonHeight = 56;" lib/main.dart
          grep -q "static const EdgeInsets screenPadding = EdgeInsets.fromLTRB(20, 8, 20, 32);" lib/main.dart
          grep -q "padding: const EdgeInsets.fromLTRB(20, 16, 20, 16)" lib/main.dart
          ! grep -q "height: compact ? 52 : 58" lib/main.dart
          ! grep -q "fromLTRB(20, 12, 20, 112)" lib/main.dart

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format source
        run: dart format lib/main.dart

      - name: Analyze
        run: flutter analyze

      - name: Test ledger invariants
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Verify scope after formatting
        run: |
          git diff --check
          if git diff --unified=0 -- lib/main.dart | grep -E '^[+-].*(Color\(|appleBlue|appleGreen|semanticRed|appleRed|gradient:|Firebase|LedgerMath|sync\.write|_businessTones)'; then
            echo "Scope violation after format: color/theme/backend logic changed."
            exit 1
          fi

      - name: Remove one-off migration files
        run: |
          rm -f .github/ui_geometry_upgrade.patch
          rm -f .github/workflows/oneoff-ui-geometry-upgrade.yml

      - name: Commit verified UI geometry upgrade
        run: |
          git config user.name "Aarish UI Geometry Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refine UI geometry and typography hierarchy [skip ci]"
          git push origin HEAD:main
