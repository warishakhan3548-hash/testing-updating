name: One-off Uniform Summary Cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-uniform-summary-cards.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply guarded alignment patch
        run: python3 .github/patch_uniform_summary_cards.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format
        run: dart format lib/main.dart

      - name: Geometry guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('lib/main.dart').read_text(encoding='utf-8')

          dash = src[src.index('class DashboardScreen'):src.index('class _SyncPill')]
          assert dash.count('_MetricCard(') == 4, 'Dashboard must contain exactly four metric cards'
          assert 'crossAxisCount: 2' in dash
          assert 'crossAxisSpacing: 13' in dash
          assert 'mainAxisSpacing: 13' in dash
          assert 'childAspectRatio: 1.0' in dash

          metric = src[src.index('class _MetricCard'):src.index('class _LedgerIcon')]
          assert 'borderColor: color.withAlpha(60)' in metric

          biz = src[src.index('class BusinessDetailScreen'):src.index('class _AiMessage')]
          assert 'crossAxisCount: 2' in biz
          assert 'crossAxisSpacing: 11' in biz
          assert 'mainAxisSpacing: 11' in biz
          assert 'childAspectRatio: 1.55' in biz
          assert 'if (totals.values.any' not in biz, 'Business summary grid must not collapse'
          grid_start = biz.index('GridView.count(')
          grid_end = biz.index("const SizedBox(height: 24)", grid_start)
          grid = biz[grid_start:grid_end]
          assert '.where(' not in grid, 'Business summary cards must not be filtered'
          assert 'totals.entries' in grid, 'Business summary grid must render all four totals entries'
          print('GEOMETRY_OK dashboard=2x2 business=2x2 fixed-order')
          PY

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Diff scope guard
        run: |
          git diff -- lib/main.dart > /tmp/layout.diff
          python3 - <<'PY'
          from pathlib import Path
          d = Path('/tmp/layout.diff').read_text(encoding='utf-8')
          required = [
              'borderColor: color.withAlpha(60)',
              'if (totals.values.any',
              '.where((MapEntry<String, double> item)',
          ]
          for item in required:
              if item not in d:
                  raise SystemExit(f'Expected alignment delta missing: {item}')
          forbidden = [
              '_BottomNavModuleIcon',
              '_CreditMoneyHandIcon',
              'class _ScreenHeader',
              'class _ListCard',
              'class _GlassCard',
              '_businessTones =',
          ]
          for item in forbidden:
              if item in d:
                  raise SystemExit(f'Forbidden unrelated scope touched: {item}')
          print('SCOPE_OK only summary-card alignment changed')
          PY

      - name: Commit verified alignment fix
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Align dashboard and business summary cards [skip ci]
          file_pattern: lib/main.dart
