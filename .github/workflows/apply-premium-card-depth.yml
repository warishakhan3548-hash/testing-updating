name: One-off Premium Card Depth

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-premium-card-depth.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply guarded premium card depth
        run: python3 .github/premium_card_depth.py

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format
        run: dart format lib/main.dart

      - name: Analyze
        run: flutter analyze

      - name: Test ledger invariants
        run: flutter test

      - name: Commit verified premium card depth
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add premium card depth and subtle bounce [skip ci]
          file_pattern: lib/main.dart
