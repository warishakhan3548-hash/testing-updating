name: One-off Restore Reference Card Geometry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-restore-reference-card-geometry.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply guarded reference geometry patch
        run: python3 .github/patch_restore_reference_card_geometry.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format
        run: dart format lib/main.dart

      - name: Geometry guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('lib/main.dart').read_text(encoding='utf-8')
          assert 'class _CompactTwoByTwoGrid' not in src

          dash = src[src.index('class DashboardScreen'):src.index('class _SyncPill')]
          assert 'GridView.count(' in dash
          assert 'crossAxisCount: 2' in dash
          assert 'crossAxisSpacing: 13' in dash
          assert 'mainAxisSpacing: 13' in dash
          assert 'childAspectRatio: 1.0' in dash

          biz = src[src.index('class BusinessDetailScreen'):src.index('class _AiMessage')]
          assert 'GridView.count(' in biz
          assert 'crossAxisCount: 2' in biz
          assert 'crossAxisSpacing: 11' in biz
          assert 'mainAxisSpacing: 11' in biz
          assert 'childAspectRatio: 1.55' in biz
          grid_start = biz.index('GridView.count(')
          grid_end = biz.index('const SizedBox(height: 24)', grid_start)
          grid = biz[grid_start:grid_end]
          assert '.where(' not in grid
          assert 'totals.entries.map' in grid or 'totals.entries\n' in grid
          print('GEOMETRY_OK reference Dashboard + Business dimensions restored')
          PY

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Diff scope guard
        run: |
          git diff -- lib/main.dart > /tmp/reference-geometry.diff
          python3 - <<'PY'
          from pathlib import Path
          d = Path('/tmp/reference-geometry.diff').read_text(encoding='utf-8')
          required = [
            '_CompactTwoByTwoGrid',
            'crossAxisSpacing: 13',
            'mainAxisSpacing: 13',
            'childAspectRatio: 1.0',
            'crossAxisSpacing: 11',
            'mainAxisSpacing: 11',
            'childAspectRatio: 1.55',
          ]
          for item in required:
            if item not in d:
              raise SystemExit(f'Expected geometry delta missing: {item}')
          forbidden = [
            '_BottomNavModuleIcon', '_CreditMoneyHandIcon',
            'class _ScreenHeader', 'class _ListCard',
            'class _GlassCard', 'Firebase', 'LedgerMath',
            'borderColor: color.withAlpha(60)',
          ]
          for item in forbidden:
            if item in d:
              raise SystemExit(f'Forbidden unrelated scope touched: {item}')
          print('SCOPE_OK only card geometry transplanted from reference')
          PY

      - name: Commit verified reference geometry
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Restore card geometry from reference main.dart [skip ci]
          file_pattern: lib/main.dart
