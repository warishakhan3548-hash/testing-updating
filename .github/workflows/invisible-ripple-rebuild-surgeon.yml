name: Invisible Ripple Rebuild Surgeon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/invisible-ripple-rebuild-surgeon.yml"

permissions:
  contents: write

concurrency:
  group: invisible-ripple-rebuild-main
  cancel-in-progress: false

jobs:
  patch-analyze-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Patch only the invisible ripple rebuild lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path("lib/main.dart")
          test_path = Path("test/global_tap_ripple_intent_test.dart")

          source = main_path.read_text(encoding="utf-8")
          lifecycle_marker = "class _RipplePulse {"
          painter_marker = "class _GlobalTapRipplePainter extends CustomPainter"
          ambient_marker = "class _AmbientBackground extends StatelessWidget"

          start = source.find(lifecycle_marker)
          painter_start = source.find(painter_marker)
          ambient_start = source.find(ambient_marker, painter_start)

          if start < 0 or painter_start <= start or ambient_start <= painter_start:
              raise SystemExit("Ripple lifecycle/painter anchors do not match audited main.")

          old_lifecycle = source[start:painter_start]
          old_painter = source[painter_start:ambient_start]

          required = (
              "static const double _scrollThreshold = 8;",
              "static const int _maxActivePulses = 2;",
              "UIConstants.globalRippleIntentDelay",
              "class _GlobalTapRippleLayerState",
              "Listenable.merge(",
              "RepaintBoundary(",
              "_pointerPulses",
              "void scheduleStart(Duration delay)",
              "void startNow()",
          )
          for token in required:
              if token not in old_lifecycle:
                  raise SystemExit(f"Audited lifecycle contract missing: {token}")

          new_lifecycle = r"""class _RipplePulse {
            _RipplePulse({
              required this.pointer,
              required this.origin,
              required this.downPosition,
              required TickerProvider vsync,
            }) : controller = AnimationController(
                   vsync: vsync,
                   duration: const Duration(milliseconds: 200),
                   reverseDuration: const Duration(milliseconds: 65),
                 );

            final int pointer;
            final Offset origin;
            final Offset downPosition;
            final AnimationController controller;
            Timer? _startTimer;
            bool _started = false;
            bool cancelled = false;
            bool disposed = false;

            bool get started => _started;

            void scheduleStart(Duration delay, VoidCallback onDue) {
              if (disposed || cancelled || _started) return;
              _startTimer?.cancel();

              if (delay.inMicroseconds <= 0) {
                onDue();
                return;
              }

              _startTimer = Timer(delay, onDue);
            }

            bool prepareStart() {
              if (disposed || cancelled || _started) return false;
              _startTimer?.cancel();
              _startTimer = null;
              _started = true;
              return true;
            }

            void play() {
              if (disposed || cancelled || !_started) return;
              controller.forward(from: 0);
            }

            bool cancel() {
              if (cancelled || disposed) return false;
              cancelled = true;
              _startTimer?.cancel();
              _startTimer = null;

              if (!_started) return false;

              controller.animateBack(
                0,
                duration: const Duration(milliseconds: 65),
                curve: Curves.easeOutCubic,
              );
              return true;
            }

            void dispose() {
              if (disposed) return;
              disposed = true;
              _startTimer?.cancel();
              _startTimer = null;
              controller.dispose();
            }
          }

          class _GlobalTapRippleLayerState extends State<_GlobalTapRippleLayer>
              with TickerProviderStateMixin {
            static const double _scrollThreshold = 8;
            static const int _maxActivePulses = 2;

            // _livePulses owns every pulse from pointer-down until disposal.
            // _pulses contains only pulses that are actually visible/animating.
            //
            // Pending tap intent therefore remains outside the widget render state:
            // a swipe cancelled before the intent delay performs no setState and
            // never creates a CustomPaint node.
            final List<_RipplePulse> _livePulses = <_RipplePulse>[];
            final List<_RipplePulse> _pulses = <_RipplePulse>[];
            final Map<int, _RipplePulse> _pointerPulses = <int, _RipplePulse>{};

            @override
            void didChangeDependencies() {
              super.didChangeDependencies();
              if (AppMotion.enabled(context) || _livePulses.isEmpty) return;

              // didChangeDependencies is already followed by a build, so no extra
              // rebuild is necessary while purging motion that has just been disabled.
              for (final _RipplePulse pulse in List<_RipplePulse>.of(_livePulses)) {
                _removePulse(pulse, rebuild: false);
              }
            }

            void _startPulse(_RipplePulse pulse) {
              if (!mounted ||
                  !_livePulses.contains(pulse) ||
                  !pulse.prepareStart()) {
                return;
              }

              // Promote into paint state exactly once, and only when the ripple is
              // genuinely going to animate. Animation ticks thereafter use the
              // CustomPainter repaint Listenable rather than widget rebuilds.
              setState(() {
                if (!_pulses.contains(pulse)) {
                  _pulses.add(pulse);
                }
              });

              pulse.play();
            }

            void _handlePointerDown(PointerDownEvent event) {
              if (!AppMotion.enabled(context) || (event.buttons & kPrimaryButton) == 0) {
                return;
              }

              final _RipplePulse? existing = _pointerPulses.remove(event.pointer);
              if (existing != null) {
                _removePulse(existing, rebuild: existing.started);
              }

              while (_livePulses.length >= _maxActivePulses) {
                final _RipplePulse oldest = _livePulses.first;
                _removePulse(oldest, rebuild: oldest.started);
              }

              final _RipplePulse pulse = _RipplePulse(
                pointer: event.pointer,
                origin: event.localPosition,
                downPosition: event.position,
                vsync: this,
              );

              pulse.controller.addStatusListener((AnimationStatus status) {
                if (status == AnimationStatus.completed ||
                    (pulse.cancelled && status == AnimationStatus.dismissed)) {
                  _finishPulse(pulse);
                }
              });

              // Logical pointer ownership does not affect layout or paint, so storing
              // pending intent here deliberately avoids setState.
              _livePulses.add(pulse);
              _pointerPulses[event.pointer] = pulse;

              pulse.scheduleStart(
                UIConstants.globalRippleIntentDelay,
                () => _startPulse(pulse),
              );
            }

            void _handlePointerMove(PointerMoveEvent event) {
              final _RipplePulse? pulse = _pointerPulses[event.pointer];
              if (pulse == null || pulse.cancelled) return;

              if ((event.position - pulse.downPosition).distance > _scrollThreshold) {
                _pointerPulses.remove(event.pointer);

                // A pending pulse has never entered _pulses and therefore requires
                // no rebuild when discarded. A started pulse reverses through its
                // controller and is removed by its status listener.
                if (!pulse.cancel()) {
                  _removePulse(pulse, rebuild: false);
                }
              }
            }

            void _handlePointerUp(PointerUpEvent event) {
              final _RipplePulse? pulse = _pointerPulses.remove(event.pointer);
              if (pulse != null) {
                // Quick taps do not wait for the remainder of the intent delay.
                _startPulse(pulse);
              }
            }

            void _handlePointerCancel(PointerCancelEvent event) {
              final _RipplePulse? pulse = _pointerPulses.remove(event.pointer);
              if (pulse != null && !pulse.cancel()) {
                // Pending cancellation is a pure logical-state disposal: there has
                // never been anything in the painter to rebuild away.
                _removePulse(pulse, rebuild: false);
              }
            }

            void _finishPulse(_RipplePulse pulse) {
              if (!mounted || !_livePulses.contains(pulse)) return;

              setState(() {
                _livePulses.remove(pulse);
                _pulses.remove(pulse);

                if (_pointerPulses[pulse.pointer] == pulse) {
                  _pointerPulses.remove(pulse.pointer);
                }
              });

              // Never dispose an AnimationController while its status notification
              // is still unwinding.
              scheduleMicrotask(pulse.dispose);
            }

            void _removePulse(_RipplePulse pulse, {required bool rebuild}) {
              if (!_livePulses.contains(pulse)) return;

              void remove() {
                _livePulses.remove(pulse);
                _pulses.remove(pulse);

                if (_pointerPulses[pulse.pointer] == pulse) {
                  _pointerPulses.remove(pulse.pointer);
                }
              }

              // Only a pulse that has actually entered the visible paint list can
              // require a rebuild when removed.
              if (rebuild && pulse.started && mounted) {
                setState(remove);
              } else {
                remove();
              }

              pulse.dispose();
            }

            @override
            void dispose() {
              for (final _RipplePulse pulse in _livePulses) {
                pulse.dispose();
              }

              _livePulses.clear();
              _pulses.clear();
              _pointerPulses.clear();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              // The application subtree must keep the same parent whether a pulse
              // exists or not. Conditionally inserting/removing the Stack would
              // reparent the Navigator subtree on every tap, causing avoidable
              // element churn and risking focus/state discontinuities.
              final List<_RipplePulse> snapshot = List<_RipplePulse>.unmodifiable(
                _pulses,
              );

              return Listener(
                behavior: HitTestBehavior.translucent,
                onPointerDown: _handlePointerDown,
                onPointerMove: _handlePointerMove,
                onPointerUp: _handlePointerUp,
                onPointerCancel: _handlePointerCancel,
                child: Stack(
                  fit: StackFit.expand,
                  children: <Widget>[
                    widget.child,
                    if (snapshot.isNotEmpty)
                      IgnorePointer(
                        child: RepaintBoundary(
                          child: CustomPaint(
                            painter: _GlobalTapRipplePainter(
                              pulses: snapshot,
                              repaint: Listenable.merge(
                                snapshot
                                    .map<Listenable>(
                                      (_RipplePulse pulse) => pulse.controller,
                                    )
                                    .toList(),
                              ),
                            ),
                          ),
                        ),
                      ),
                  ],
                ),
              );
            }
          }

          """

          import textwrap
          new_lifecycle = textwrap.dedent(new_lifecycle)

          patched = source[:start] + new_lifecycle + source[painter_start:]

          new_painter_start = patched.find(painter_marker)
          new_ambient_start = patched.find(ambient_marker, new_painter_start)
          new_painter = patched[new_painter_start:new_ambient_start]

          if new_painter != old_painter:
              raise SystemExit("VISUAL LOCK VIOLATION: ripple painter changed.")

          for sentinel in (
              "final double radius = 6 + 48 * expansion;",
              "final int coreAlpha = (opacity * 31).round().clamp(0, 255).toInt();",
              "final int haloAlpha = (opacity * 14).round().clamp(0, 255).toInt();",
              "final int ringAlpha = (opacity * 112).round().clamp(0, 255).toInt();",
          ):
              if sentinel not in new_painter:
                  raise SystemExit(f"VISUAL LOCK VIOLATION: missing {sentinel}")

          test_source = r"""import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            late String source;

            setUpAll(() {
              source = File('lib/main.dart').readAsStringSync();
            });

            group('global tap ripple gesture intent', () {
              test('defers pointer-down paint until tap intent is known', () {
                expect(
                  source,
                  contains('globalRippleIntentDelay = Duration(milliseconds: 48)'),
                );
                expect(source, contains('Timer? _startTimer;'));
                expect(
                  source,
                  contains(
                    'void scheduleStart(Duration delay, VoidCallback onDue)',
                  ),
                );
                expect(source, contains('bool prepareStart()'));
                expect(source, contains('void play()'));
                expect(
                  source,
                  contains(
                    'pulse.scheduleStart(\n'
                    '      UIConstants.globalRippleIntentDelay,\n'
                    '      () => _startPulse(pulse),\n'
                    '    );',
                  ),
                );
                expect(source, isNot(contains('    pulse.start();')));
              });

              test('pending pointer-down state never enters the paint list or rebuilds', () {
                final int start = source.indexOf('void _handlePointerDown(');
                final int end = source.indexOf('void _handlePointerMove(', start);

                expect(start, greaterThanOrEqualTo(0));
                expect(end, greaterThan(start));

                final String handler = source.substring(start, end);

                expect(handler, contains('_livePulses.add(pulse);'));
                expect(
                  handler,
                  contains('_pointerPulses[event.pointer] = pulse;'),
                );
                expect(handler, isNot(contains('_pulses.add(pulse);')));
                expect(handler, isNot(contains('setState(()')));
              });

              test('promotion performs one meaningful visible-state transition', () {
                final int start = source.indexOf('void _startPulse(');
                final int end = source.indexOf('void _handlePointerDown(', start);

                expect(start, greaterThanOrEqualTo(0));
                expect(end, greaterThan(start));

                final String handler = source.substring(start, end);

                expect(handler, contains('!_livePulses.contains(pulse)'));
                expect(handler, contains('!pulse.prepareStart()'));
                expect(
                  RegExp(r'setState\(\(\) \{').allMatches(handler),
                  hasLength(1),
                );
                expect(handler, contains('_pulses.add(pulse);'));
                expect(handler, contains('pulse.play();'));
              });

              test('quick taps activate immediately on pointer release', () {
                final int start = source.indexOf('void _handlePointerUp(');
                final int end = source.indexOf('void _handlePointerCancel(', start);

                expect(start, greaterThanOrEqualTo(0));
                expect(end, greaterThan(start));

                final String handler = source.substring(start, end);

                expect(
                  handler,
                  contains(
                    'final _RipplePulse? pulse = '
                    '_pointerPulses.remove(event.pointer);',
                  ),
                );
                expect(handler, contains('_startPulse(pulse);'));
                expect(handler, isNot(contains('pulse?.startNow();')));
              });

              test('pre-intent scroll and cancellation cause no rebuild', () {
                expect(source, contains('bool cancel()'));
                expect(source, contains('if (!_started) return false;'));
                expect(
                  source,
                  contains(
                    'final List<_RipplePulse> _livePulses = <_RipplePulse>[];',
                  ),
                );
                expect(
                  source.split('_removePulse(pulse, rebuild: false);').length - 1,
                  greaterThanOrEqualTo(3),
                );
                expect(source, contains('_startTimer?.cancel();'));

                final int moveStart = source.indexOf('void _handlePointerMove(');
                final int moveEnd = source.indexOf('void _handlePointerUp(', moveStart);
                final String moveHandler = source.substring(moveStart, moveEnd);
                expect(
                  moveHandler,
                  contains('_removePulse(pulse, rebuild: false);'),
                );
                expect(
                  moveHandler,
                  isNot(contains('_removePulse(pulse, rebuild: true);')),
                );

                final int cancelStart = source.indexOf('void _handlePointerCancel(');
                final int cancelEnd = source.indexOf('void _finishPulse(', cancelStart);
                final String cancelHandler = source.substring(cancelStart, cancelEnd);
                expect(
                  cancelHandler,
                  contains('_removePulse(pulse, rebuild: false);'),
                );
                expect(
                  cancelHandler,
                  isNot(contains('_removePulse(pulse, rebuild: true);')),
                );
              });

              test('animation ticks remain painter-driven rather than widget-driven', () {
                final int start = source.indexOf(
                  'class _GlobalTapRippleLayerState',
                );
                final int end = source.indexOf(
                  'class _GlobalTapRipplePainter extends CustomPainter',
                  start,
                );

                expect(start, greaterThanOrEqualTo(0));
                expect(end, greaterThan(start));

                final String layer = source.substring(start, end);

                expect(layer, contains('RepaintBoundary('));
                expect(layer, contains('CustomPaint('));
                expect(layer, contains('repaint: Listenable.merge('));
                expect(
                  layer,
                  contains(
                    '(_RipplePulse pulse) => pulse.controller',
                  ),
                );
              });

              test('ripple painter visual contract stays unchanged', () {
                final int start = source.indexOf(
                  'class _GlobalTapRipplePainter extends CustomPainter',
                );
                final int end = source.indexOf(
                  'class _AmbientBackground extends StatelessWidget',
                  start,
                );

                expect(start, greaterThanOrEqualTo(0));
                expect(end, greaterThan(start));

                final String painter = source.substring(start, end);

                expect(
                  painter,
                  contains('final double radius = 6 + 48 * expansion;'),
                );
                expect(
                  painter,
                  contains('final int coreAlpha = (opacity * 31)'),
                );
                expect(
                  painter,
                  contains('final int haloAlpha = (opacity * 14)'),
                );
                expect(
                  painter,
                  contains('final int ringAlpha = (opacity * 112)'),
                );
              });
            });
          }
          """

          test_source = textwrap.dedent(test_source)

          pointer_down = new_lifecycle[
              new_lifecycle.index("void _handlePointerDown("):
              new_lifecycle.index("void _handlePointerMove(")
          ]
          if "setState(()" in pointer_down or "_pulses.add(pulse);" in pointer_down:
              raise SystemExit("Invariant failed: pointer-down still mutates paint state.")
          if "_livePulses.add(pulse);" not in pointer_down:
              raise SystemExit("Invariant failed: live pulse ownership missing.")

          main_path.write_text(patched, encoding="utf-8")
          test_path.write_text(test_source, encoding="utf-8")
          print("Surgical ripple lifecycle patch applied.")
          PY

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/main.dart test/global_tap_ripple_intent_test.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --fatal-infos

      - name: Commit and push immediately after analyze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "warishakhan3548-hash"
          git config user.email "warishakhan3548-hash@users.noreply.github.com"

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git rebase --autostash origin/main
            flutter analyze --fatal-infos
          fi

          git rm -- .github/workflows/invisible-ripple-rebuild-surgeon.yml
          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "Eliminate invisible ripple rebuilds"
          git push origin HEAD:main
