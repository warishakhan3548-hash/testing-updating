name: Apply cross-system motion upgrade

on:
  push:
    branches: [main]
    paths:
      - 'tool/apply_cross_system_motion_upgrade.dart'
      - '.github/workflows/apply-cross-system-motion-upgrade.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Apply guarded cross-system motion upgrade
        run: dart run tool/apply_cross_system_motion_upgrade.dart

      - name: Check patch
        run: git diff --check

      - name: Commit interaction upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refine modal, focus and reduced-motion UX"
          git push
