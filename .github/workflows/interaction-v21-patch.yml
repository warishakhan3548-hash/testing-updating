name: Interaction Engine V2.1 Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/interaction-v21-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply interaction engine V2.1
        run: python3 .github/interaction_v21_patch.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit interaction engine V2.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "ui: upgrade interaction engine to v2.1"
          git push origin HEAD:main
