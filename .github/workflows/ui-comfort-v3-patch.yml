name: UI Comfort V3 Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ui-comfort-v3-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Harden patch generator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/ui_comfort_v3_patch.py')
          source = path.read_text(encoding='utf-8')
          old_shadow = '            shadows: <Shadow>[\n              Shadow(color: glow.withAlpha(94), blurRadius: 16),\n            ],\n          ),\n'
          new_shadow = '            shadows: <Shadow>[Shadow(color: glow.withAlpha(94), blurRadius: 16)],\n          ),\n'
          old_test = "    expect(source, isNot(contains('onTap: () {},'));\n"
          new_test = "    expect(source, isNot(contains('onTap: () {},')));\n"
          if source.count(old_shadow) != 1:
              raise SystemExit('hero color-expression patch did not match exactly once')
          if source.count(old_test) != 1:
              raise SystemExit('regression-guard syntax patch did not match exactly once')
          source = source.replace(old_shadow, new_shadow, 1)
          source = source.replace(old_test, new_test, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply UI comfort V3
        run: python3 .github/ui_comfort_v3_patch.py

      - name: Use share-button API intentionally
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/main.dart')
          source = path.read_text(encoding='utf-8')
          old = "                      _SoftShareButton(\n                        label: 'Share',\n                        icon: Icons.share_rounded,\n                        color: appleBlue,\n                        onTap: () => unawaited(\n"
          new = "                      _SoftShareButton(\n                        label: 'Share',\n                        icon: Icons.share_rounded,\n                        color: appleBlue,\n                        semanticLabel: 'Share this section as PDF',\n                        compact: false,\n                        onTap: () => unawaited(\n"
          count = source.count(old)
          if count != 5:
              raise SystemExit(f'share-button call sites: expected 5, found {count}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

      - name: Validate whitespace
        run: git diff --check

      - name: Resolve packages
        run: flutter pub get

      - name: Format touched Dart sources
        run: dart format --language-version latest lib/main.dart test/ui_micro_aesthetics_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit validated UI comfort V3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart test/ui_micro_aesthetics_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "ui: polish accessibility and interaction comfort"
          git push origin HEAD:main
