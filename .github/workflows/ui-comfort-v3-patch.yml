name: UI Comfort V3 Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ui-comfort-v3-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Preserve exact hero color expression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/ui_comfort_v3_patch.py')
          source = path.read_text(encoding='utf-8')
          old = """            shadows: <Shadow>[
              Shadow(color: glow.withAlpha(94), blurRadius: 16),
            ],
          ),
"""
          new = """            shadows: <Shadow>[Shadow(color: glow.withAlpha(94), blurRadius: 16)],
          ),
"""
          if source.count(old) != 1:
              raise SystemExit('hero color-expression patch did not match exactly once')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply UI comfort V3
        run: python3 .github/ui_comfort_v3_patch.py

      - name: Validate whitespace
        run: git diff --check

      - name: Format touched Dart sources
        run: dart format --language-version latest lib/main.dart test/ui_micro_aesthetics_test.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit validated UI comfort V3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart test/ui_micro_aesthetics_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "ui: polish accessibility and interaction comfort"
          git push origin HEAD:main
