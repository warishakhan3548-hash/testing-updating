name: One-off Restore Dashboard Reference Grid

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-restore-dashboard-reference-grid.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply guarded reference-grid patch
        run: python3 .github/patch_restore_dashboard_reference_grid.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format
        run: dart format lib/main.dart

      - name: Dashboard geometry guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('lib/main.dart').read_text(encoding='utf-8')
          dash = src[src.index('class DashboardScreen'):src.index('class _SyncPill')]
          required = [
              'GridView.count(',
              'crossAxisCount: 2',
              'crossAxisSpacing: 13',
              'mainAxisSpacing: 13',
              'childAspectRatio: 1.0',
              "label: 'To Receive (+)'",
              "label: 'To Pay (-)'",
              "label: 'Month Expense'",
              "label: 'Month Profit'",
          ]
          for token in required:
              assert token in dash, token
          forbidden = [
              'minimumCardHeight',
              'cardHeight = math.max',
              'Widget lockedCard',
          ]
          for token in forbidden:
              assert token not in dash, token
          print('GEOMETRY_OK dashboard uses stable 2x2 1:1 reference grid')
          PY

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Diff scope guard
        run: |
          git diff -- lib/main.dart > /tmp/dashboard-reference-grid.diff
          python3 - <<'PY'
          from pathlib import Path
          d = Path('/tmp/dashboard-reference-grid.diff').read_text(encoding='utf-8')
          required = [
              'GridView.count',
              'childAspectRatio: 1.0',
              'minimumCardHeight',
              'lockedCard',
          ]
          for token in required:
              if token not in d:
                  raise SystemExit(f'Expected dashboard geometry delta missing: {token}')
          forbidden = [
              'class _BottomLedgerNav', '_BottomNavModuleIcon', '_tabs =',
              'class BusinessDetailScreen', 'class BusinessScreen',
              'class CreditScreen', 'class SalaryScreen', 'class DiaryScreen',
              'Firebase', 'LedgerMath', 'class _ScreenHeader', 'class _MetricCard',
          ]
          for token in forbidden:
              if token in d:
                  raise SystemExit(f'Forbidden unrelated scope touched: {token}')
          print('SCOPE_OK only Dashboard four-card layout geometry changed')
          PY

      - name: Commit verified dashboard reference grid
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Restore dashboard cards to stable 1:1 reference grid [skip ci]
          file_pattern: lib/main.dart
