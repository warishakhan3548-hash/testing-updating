name: One-off Lock Dashboard Card Geometry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-lock-dashboard-card-geometry.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply guarded dashboard geometry lock patch
        run: python3 .github/patch_lock_dashboard_card_geometry.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format
        run: dart format lib/main.dart

      - name: Geometry guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('lib/main.dart').read_text(encoding='utf-8')
          dash = src[src.index('class DashboardScreen'):src.index('class _SyncPill')]
          assert 'final double cardHeight = math.max(' in dash
          assert 'minimumCardHeight,' in dash
          assert 'cardWidth,' in dash
          assert 'Widget lockedCard(Widget child) => SizedBox(' in dash
          assert 'width: cardWidth' in dash
          assert 'height: cardHeight' in dash
          assert dash.count('lockedCard(') >= 5
          assert 'GridView.count(' not in dash
          print('GEOMETRY_LOCK_OK outer dashboard cards have explicit width/height independent of amount')
          PY

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Diff scope guard
        run: |
          git diff -- lib/main.dart > /tmp/dashboard-lock.diff
          python3 - <<'PY'
          from pathlib import Path
          d = Path('/tmp/dashboard-lock.diff').read_text(encoding='utf-8')
          required = [
              'cardHeight = math.max',
              'lockedCard',
              'width: cardWidth',
              'height: cardHeight',
          ]
          for item in required:
              if item not in d:
                  raise SystemExit(f'Expected dashboard lock delta missing: {item}')
          forbidden = [
              'class _BottomLedgerNav', '_BottomNavModuleIcon', '_tabs =',
              'class BusinessDetailScreen', 'class BusinessScreen',
              'class CreditScreen', 'class SalaryScreen', 'class DiaryScreen',
              'Firebase', 'LedgerMath', 'class _ScreenHeader',
          ]
          for item in forbidden:
              if item in d:
                  raise SystemExit(f'Forbidden unrelated scope touched: {item}')
          print('SCOPE_OK only Dashboard grid geometry changed')
          PY

      - name: Commit verified dashboard geometry lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Lock dashboard card geometry independent of amount [skip ci]
          file_pattern: lib/main.dart
