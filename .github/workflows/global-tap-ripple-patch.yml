name: Global Tap Ripple Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/global-tap-ripple-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply global blue tap ripple only
        run: |
          python3 .github/global_tap_patch.py
          git diff --check
          git diff -- lib/main.dart

      - name: Commit global tap ripple
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "ui: add global 200ms blue tap ripple"
          git push origin HEAD:main
