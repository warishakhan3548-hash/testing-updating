name: Global Tap Ripple Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/global-tap-ripple-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply global blue tap ripple only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/main.dart')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              s = s.replace(old, new, 1)

          # Remove the previous clickable-only ripple implementation completely.
          replace_once(
              "  static const Duration tapRipple = Duration(milliseconds: 200);\n",
              "",
              "tapRipple duration",
          )
          replace_once(
              "class _PressableState extends State<_Pressable>\n    with TickerProviderStateMixin {",
              "class _PressableState extends State<_Pressable>\n    with SingleTickerProviderStateMixin {",
              "Pressable ticker mixin",
          )
          replace_once(
              "  late final AnimationController _pressController;\n  late final AnimationController _rippleController;\n  Alignment _touchAlignment = Alignment.center;\n",
              "  late final AnimationController _pressController;\n  Alignment _touchAlignment = Alignment.center;\n",
              "Pressable ripple controller declaration",
          )
          replace_once(
              """    _pressController = AnimationController(\n      vsync: this,\n      value: 0,\n      lowerBound: -.18,\n      upperBound: 1,\n      duration: UIConstants.pressIn,\n      reverseDuration: UIConstants.pressOut,\n    );\n    _rippleController = AnimationController(\n      vsync: this,\n      duration: UIConstants.tapRipple,\n    );\n""",
              """    _pressController = AnimationController(\n      vsync: this,\n      value: 0,\n      lowerBound: -.18,\n      upperBound: 1,\n      duration: UIConstants.pressIn,\n      reverseDuration: UIConstants.pressOut,\n    );\n""",
              "Pressable controller init",
          )
          replace_once(
              """      _pressController.stop();\n      _pressController.value = 0;\n      _rippleController.stop();\n      _rippleController.value = 0;\n""",
              """      _pressController.stop();\n      _pressController.value = 0;\n""",
              "Pressable disabled reset",
          )
          replace_once(
              """  void _press([TapDownDetails? details]) {\n    if (widget.onTap == null) return;\n    if (details != null) {\n      _captureTouch(details);\n      if (!AppMotion.reduce(context)) _rippleController.forward(from: 0);\n    }\n    if (!widget.animatePress) return;\n    _pressController.animateTo(\n      1,\n      duration: UIConstants.pressIn,\n      curve: Curves.easeOutCubic,\n    );\n  }\n""",
              """  void _press([TapDownDetails? details]) {\n    if (widget.onTap == null || !widget.animatePress) return;\n    if (details != null) _captureTouch(details);\n    _pressController.animateTo(\n      1,\n      duration: UIConstants.pressIn,\n      curve: Curves.easeOutCubic,\n    );\n  }\n""",
              "Pressable press handler",
          )
          replace_once(
              """  void dispose() {\n    _pressController.dispose();\n    _rippleController.dispose();\n    super.dispose();\n  }\n""",
              """  void dispose() {\n    _pressController.dispose();\n    super.dispose();\n  }\n""",
              "Pressable dispose",
          )
          replace_once(
              "      onTapDown: widget.onTap == null ? null : _press,\n",
              "      onTapDown: widget.onTap == null || !widget.animatePress ? null : _press,\n",
              "Pressable tap down",
          )
          replace_once(
              """      child: AnimatedBuilder(\n        animation: Listenable.merge(<Listenable>[\n          _pressController,\n          _rippleController,\n        ]),\n        child: widget.child,\n""",
              """      child: AnimatedBuilder(\n        animation: _pressController,\n        child: widget.child,\n""",
              "Pressable animation source",
          )
          replace_once(
              """          final double pressed = feedback.clamp(0.0, 1.0).toDouble();\n          final double rippleProgress = reduceMotion ? 0 : _rippleController.value;\n          final double rippleWave = Curves.easeOutCubic.transform(\n            rippleProgress.clamp(0.0, 1.0).toDouble(),\n          );\n          final double rippleFade = (1 - rippleProgress)\n              .clamp(0.0, 1.0)\n              .toDouble();\n          final Color rippleColor =\n              widget.feedbackColor ?? Theme.of(context).colorScheme.primary;\n          final double motion = reduceMotion ? 0 : feedback;\n""",
              """          final double pressed = feedback.clamp(0.0, 1.0).toDouble();\n          final double motion = reduceMotion ? 0 : feedback;\n""",
              "Pressable ripple variables",
          )
          replace_once(
              """                            if (rippleProgress > 0 && rippleProgress < 1)\n                              DecoratedBox(\n                                decoration: BoxDecoration(\n                                  gradient: RadialGradient(\n                                    center: _touchAlignment,\n                                    radius: .16 + rippleWave * 1.08,\n                                    colors: <Color>[\n                                      rippleColor.withAlpha(\n                                        (rippleFade * (dark ? 16 : 12)).round(),\n                                      ),\n                                      Colors.transparent,\n                                      rippleColor.withAlpha(\n                                        (rippleFade * (dark ? 82 : 64)).round(),\n                                      ),\n                                      Colors.transparent,\n                                    ],\n                                    stops: const <double>[0, .38, .66, 1],\n                                  ),\n                                ),\n                              ),\n""",
              "",
              "Pressable ripple painter block",
          )

          # Remove color plumbing that was added only for the old ripple.
          replace_once(
              """        semanticLabel: semanticLabel,\n        borderRadius: BorderRadius.circular(24),\n        feedbackColor: color,\n        child: Container(\n""",
              """        semanticLabel: semanticLabel,\n        borderRadius: BorderRadius.circular(24),\n        child: Container(\n""",
              "CircleAction ripple color",
          )
          replace_once(
              """        semanticLabel: semanticLabel,\n        borderRadius: radius,\n        feedbackColor: appleRed,\n        child: Container(\n""",
              """        semanticLabel: semanticLabel,\n        borderRadius: radius,\n        child: Container(\n""",
              "DeleteAction ripple color",
          )
          replace_once(
              """  Widget build(BuildContext context) => _Pressable(\n    onTap: onTap,\n    borderRadius: BorderRadius.circular(UIConstants.actionRadius),\n    feedbackColor: color,\n    child: Container(\n""",
              """  Widget build(BuildContext context) => _Pressable(\n    onTap: onTap,\n    borderRadius: BorderRadius.circular(UIConstants.actionRadius),\n    child: Container(\n""",
              "PrimaryButton ripple color",
          )

          # Install exactly one root-level touch engine. This sees raw pointer
          # downs even when the tapped area itself has no onTap callback.
          builder_old = """    builder: (BuildContext context, Widget? child) =>\n        _AmbientBackground(child: child ?? const SizedBox.shrink()),\n"""
          builder_new = """    builder: (BuildContext context, Widget? child) => _GlobalTapRippleLayer(\n      child: _AmbientBackground(child: child ?? const SizedBox.shrink()),\n    ),\n"""
          replace_once(builder_old, builder_new, "MaterialApp root builder")

          ambient_anchor = "class _AmbientBackground extends StatelessWidget {\n"
          if s.count(ambient_anchor) != 1:
              raise SystemExit(f'Ambient anchor count={s.count(ambient_anchor)}')

          global_ripple_code = r'''class _GlobalTapRippleLayer extends StatefulWidget {
  const _GlobalTapRippleLayer({required this.child});

  final Widget child;

  @override
  State<_GlobalTapRippleLayer> createState() => _GlobalTapRippleLayerState();
}

class _GlobalTapRippleLayerState extends State<_GlobalTapRippleLayer>
    with SingleTickerProviderStateMixin {
  late final AnimationController _controller = AnimationController(
    vsync: this,
    duration: const Duration(milliseconds: 200),
  );
  Offset _origin = Offset.zero;

  void _handlePointerDown(PointerDownEvent event) {
    if (AppMotion.reduce(context)) return;
    _origin = event.localPosition;
    _controller.forward(from: 0);
  }

  @override
  void dispose() {
    _controller.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) => Listener(
    behavior: HitTestBehavior.translucent,
    onPointerDown: _handlePointerDown,
    child: AnimatedBuilder(
      animation: _controller,
      child: widget.child,
      builder: (BuildContext context, Widget? child) {
        final double raw = _controller.value;
        if (raw <= 0 || raw >= 1) return child!;
        final double progress = Curves.easeOutCubic.transform(raw);
        final double opacity = (1 - raw).clamp(0.0, 1.0).toDouble();
        return Stack(
          fit: StackFit.expand,
          children: <Widget>[
            child!,
            IgnorePointer(
              child: RepaintBoundary(
                child: CustomPaint(
                  painter: _GlobalTapRipplePainter(
                    origin: _origin,
                    progress: progress,
                    opacity: opacity,
                  ),
                ),
              ),
            ),
          ],
        );
      },
    ),
  );
}

class _GlobalTapRipplePainter extends CustomPainter {
  const _GlobalTapRipplePainter({
    required this.origin,
    required this.progress,
    required this.opacity,
  });

  final Offset origin;
  final double progress;
  final double opacity;

  @override
  void paint(Canvas canvas, Size size) {
    if (size.isEmpty || opacity <= 0) return;

    final double radius = 7 + 47 * progress;
    final Rect bounds = Rect.fromCircle(center: origin, radius: radius);
    final int coreAlpha = (opacity * 34).round().clamp(0, 255);
    final int haloAlpha = (opacity * 15).round().clamp(0, 255);
    final int ringAlpha = (opacity * 118).round().clamp(0, 255);

    canvas.drawCircle(
      origin,
      radius,
      Paint()
        ..shader = RadialGradient(
          colors: <Color>[
            appleBlue.withAlpha(coreAlpha),
            appleBlue.withAlpha(haloAlpha),
            Colors.transparent,
          ],
          stops: const <double>[0, .54, 1],
        ).createShader(bounds),
    );

    canvas.drawCircle(
      origin,
      radius * .86,
      Paint()
        ..color = appleBlue.withAlpha(ringAlpha)
        ..style = PaintingStyle.stroke
        ..strokeWidth = 1.9 - progress * .8,
    );

    final double echo = ((progress - .18) / .82).clamp(0.0, 1.0).toDouble();
    if (echo > 0 && echo < 1) {
      final int echoAlpha =
          (opacity * (1 - echo) * 64).round().clamp(0, 255);
      canvas.drawCircle(
        origin,
        5 + 25 * echo,
        Paint()
          ..color = appleBlue.withAlpha(echoAlpha)
          ..style = PaintingStyle.stroke
          ..strokeWidth = 1.25,
      );
    }
  }

  @override
  bool shouldRepaint(covariant _GlobalTapRipplePainter oldDelegate) =>
      oldDelegate.origin != origin ||
      oldDelegate.progress != progress ||
      oldDelegate.opacity != opacity;
}

'''
          s = s.replace(ambient_anchor, global_ripple_code + ambient_anchor, 1)

          p.write_text(s)
          PY

          git diff --check
          git diff -- lib/main.dart

      - name: Commit global tap ripple
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "ui: add global 200ms blue tap ripple"
          git push origin HEAD:main
