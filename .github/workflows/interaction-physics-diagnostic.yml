name: Interaction Physics Diagnostic
# Guarded runtime upgrade: app changes are pushed only after format, analyze, tests, and debug APK all pass.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/interaction-physics-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interaction-physics-diagnostic-main
  cancel-in-progress: false

jobs:
  validate-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reuse exact verified surgeon patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/interaction-physics-surgeon.yml').read_text()
          match = re.search(r"b64decode\('([A-Za-z0-9+/=]+)'\)", workflow)
          if not match:
              raise SystemExit('Could not locate surgeon payload')
          exec(base64.b64decode(match.group(1)), {})
          PY

      - name: Capture generated ownership contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          needles = ('canOwnTapStart', '_tapWins', '_pointerCancelled')
          chunks = []
          for filename in ('lib/main.dart', 'test/ui_micro_aesthetics_test.dart'):
              lines = Path(filename).read_text().splitlines()
              hit_lines = sorted({
                  i for i, line in enumerate(lines)
                  if any(needle in line for needle in needles)
              })
              chunks.append(f'===== {filename} =====')
              if not hit_lines:
                  chunks.append('(no ownership-token hits)')
                  continue
              windows = []
              for hit in hit_lines:
                  start = max(0, hit - 8)
                  end = min(len(lines), hit + 9)
                  if windows and start <= windows[-1][1]:
                      windows[-1] = (windows[-1][0], max(windows[-1][1], end))
                  else:
                      windows.append((start, end))
              for start, end in windows:
                  chunks.append(f'--- lines {start + 1}-{end} ---')
                  chunks.extend(
                      f'{i + 1:05d}: {lines[i]}' for i in range(start, end)
                  )
          Path('.github/interaction-generated-diagnostic.txt').write_text(
              '\n'.join(chunks) + '\n'
          )
          PY

      - name: Push diagnostic snapshot only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/interaction-generated-diagnostic.txt
          git commit -m "chore(ci): capture generated interaction contract"
          git push origin HEAD:main

      - name: Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format touched Dart files
        run: dart format lib/main.dart test/ui_micro_aesthetics_test.dart

      - name: Verify clean diff syntax
        run: git diff --check

      - name: Static analysis
        run: flutter analyze

      - name: Full Flutter tests
        run: flutter test

      - name: Debug APK build
        run: flutter build apk --debug

      - name: Enforce surgical file scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          expected="$(printf 'lib/main.dart\ntest/ui_micro_aesthetics_test.dart')"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit and push verified interaction upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart test/ui_micro_aesthetics_test.dart
          git diff --cached --quiet && { echo "No app changes to commit"; exit 1; }
          git commit -m "perf(ui): harden interaction ownership and adaptive navigation"
          git push origin HEAD:main
