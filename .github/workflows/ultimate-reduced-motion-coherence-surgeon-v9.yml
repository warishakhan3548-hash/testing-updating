name: Ultimate Reduced Motion Coherence Surgeon V9

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ultimate-reduced-motion-coherence-surgeon-v9.yml"

permissions:
  contents: write

concurrency:
  group: ultimate-reduced-motion-coherence-surgeon-v9-main
  cancel-in-progress: false

jobs:
  patch-analyze-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Apply reduced-motion coherence upgrade
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode | python3
          rm -f .github/workflows/ultimate-reduced-motion-coherence-surgeon-v9.yml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lock stayed untouched
        run: git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Format surgical targets
        run: dart format --language-version latest lib/main.dart test/ui_micro_aesthetics_test.dart

      - name: Validate locked scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/ultimate-reduced-motion-coherence-surgeon-v9.yml' 'lib/main.dart' 'test/ui_micro_aesthetics_test.dart' | sort)"
          test "$changed" = "$expected"

      - name: Flutter analyze
        run: flutter analyze

      - name: Stage commit and push analyzed upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/ultimate-reduced-motion-coherence-surgeon-v9.yml' 'lib/main.dart' 'test/ui_micro_aesthetics_test.dart' | sort)"
          test "$staged" = "$expected"
          git commit -m "perf(ui): settle live motion on reduced-motion changes [skip ci]"
          git push origin HEAD:main
