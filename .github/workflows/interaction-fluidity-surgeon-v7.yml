name: Interaction Fluidity Surgeon V7

on:
  push:
    branches: [main]
    paths:
      - ".github/interaction_patch_v7.py"
      - ".github/workflows/interaction-fluidity-surgeon-v7.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interaction-fluidity-surgeon-v7
  cancel-in-progress: false

jobs:
  patch-verify-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply surgical interaction patch
        run: python3 .github/interaction_patch_v7.py

      - name: Verify patch scope and whitespace
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed by surgeon before cleanup:\n%s\n' "${changed[*]}"
          for file in "${changed[@]}"; do
            case "$file" in
              lib/main.dart|test/ui_micro_aesthetics_test.dart) ;;
              *) echo "Unexpected file changed by surgeon: $file" >&2; exit 1 ;;
            esac
          done

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Verify formatting
        run: dart format --language-version latest --output=none --set-exit-if-changed lib/main.dart test/ui_micro_aesthetics_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run complete test suite
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Remove temporary surgeon artifacts
        run: rm -f .github/interaction_patch_v7.py .github/workflows/interaction-fluidity-surgeon-v7.yml

      - name: Commit and push verified interaction upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ui: harden gesture arbitration and motion"
          git push origin HEAD:main
