name: Firebase Functions CI

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "database.rules.json"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/functions-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked production dependencies
        run: npm ci --prefix functions --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Reject high or critical dependency advisories
        run: npm audit --prefix functions --omit=dev --audit-level=high

      - name: Validate Firebase configuration JSON
        run: node -e "const fs = require('node:fs'); for (const file of ['firebase.json', 'database.rules.json', '.firebaserc']) JSON.parse(fs.readFileSync(file, 'utf8'));"

      - name: Load function entrypoint
        run: node -e "require('./functions/index.js')"

      - name: Test projection invariants
        run: npm test --prefix functions
