name: Format Sukoon UI with resolved Dart config

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-sukoon-ui-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Canonical Dart format
        run: dart format lib/main.dart

      - name: Commit formatted source and remove this one-time workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';
            const mainPath = 'lib/main.dart';
            const workflowPath = '.github/workflows/format-sukoon-ui-v2.yml';
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            const baseSha = ref.data.object.sha;
            const baseCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: baseSha });
            const formatted = fs.readFileSync(mainPath, 'utf8');
            const blob = await github.rest.git.createBlob({ owner, repo, content: formatted, encoding: 'utf-8' });
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: baseCommit.data.tree.sha,
              tree: [
                { path: mainPath, mode: '100644', type: 'blob', sha: blob.data.sha },
                { path: workflowPath, mode: '100644', type: 'blob', sha: null },
              ],
            });
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'Canonicalize premium UI with project Dart config',
              tree: tree.data.sha,
              parents: [baseSha],
            });
            await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.data.sha });
            core.notice(`Canonical formatted commit ${commit.data.sha}`);
