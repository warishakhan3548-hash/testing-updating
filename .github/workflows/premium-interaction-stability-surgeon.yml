name: Premium Interaction Stability Surgeon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/premium-interaction-stability-surgeon.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: premium-interaction-stability-surgeon-main
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden tab and navigation interaction state
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/premium_surgeon.py
          python3 /tmp/premium_surgeon.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format surgical scope
        run: dart format --language-version latest lib/main.dart test/ui_micro_aesthetics_test.dart

      - name: Verify interaction contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('lib/main.dart').read_text()
          shell_start = source.index('class _AppShellState extends State<AppShell>')
          shell_end = source.index('class _KeepAlivePage extends StatefulWidget', shell_start)
          shell = source[shell_start:shell_end]
          required = (
              'bool _navCenterScheduled = false;',
              'void didChangeMetrics()',
              'void _retryPageSelectionWhenAttached(int index, int generation)',
              '_retryPageSelectionWhenAttached(index, generation);',
              'void _scheduleNavigationCenter()',
              'WidgetsBinding.instance.addPostFrameCallback((_) {',
              'width: 84,',
              'height: 70,',
              '..rotateY(-delta * .018)',
              'offset: Offset(0, depth * 1.8)',
          )
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f'missing premium interaction contracts: {missing}')
          stale = 'if (!_pageController.hasClients) {\n      _programmaticPageTarget = null;\n      return;'
          if stale in shell:
              raise SystemExit('stale page-controller attachment race remains')
          PY

      - name: Analyze
        run: flutter analyze

      - name: Run all tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Verify exact change scope
        shell: bash
        run: |
          git diff --exit-code -- pubspec.lock
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files before self-cleanup:\n%s\n' "${changed[*]}"
          for file in "${changed[@]}"; do
            case "$file" in
              lib/main.dart|test/ui_micro_aesthetics_test.dart) ;;
              *) echo "Unexpected changed file: $file" >&2; exit 1 ;;
            esac
          done

      - name: Self-clean verified surgeon
        run: git rm .github/workflows/premium-interaction-stability-surgeon.yml

      - name: Commit and push verified hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden premium navigation interaction state"
          git push origin HEAD:main
