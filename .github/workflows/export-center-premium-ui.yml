name: One-shot Premium Export Center UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-center-premium-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch_export_center:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply premium Export Center patch
        run: python3 .github/export_center_patch.py

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format
        run: dart format lib/main.dart

      - name: Analyze
        run: flutter analyze

      - name: Test ledger invariants
        run: flutter test

      - name: Commit and push verified UI
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Upgrade Export Center premium UI"
          git push origin HEAD:main
