name: One-shot Premium Export Center UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-center-premium-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch_export_center:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply premium Export Center patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')

          # Keep the shared sheet unchanged for every other flow, but allow this
          # one screen to center its title like the supplied premium reference.
          sheet_start = text.index('class _SheetFrame extends StatelessWidget {')
          sheet_end = text.index('\nFuture<T?> _openSheet<T>', sheet_start)
          sheet = text[sheet_start:sheet_end]

          old_ctor = '  const _SheetFrame({required this.title, required this.children});'
          new_ctor = '''  const _SheetFrame({
    required this.title,
    required this.children,
    this.centerTitle = false,
  });'''
          if sheet.count(old_ctor) != 1:
              raise SystemExit(f'_SheetFrame constructor mismatch: {sheet.count(old_ctor)}')
          sheet = sheet.replace(old_ctor, new_ctor)

          old_fields = '''  final String title;
  final List<Widget> children;'''
          new_fields = '''  final String title;
  final List<Widget> children;
  final bool centerTitle;'''
          if sheet.count(old_fields) != 1:
              raise SystemExit(f'_SheetFrame fields mismatch: {sheet.count(old_fields)}')
          sheet = sheet.replace(old_fields, new_fields)

          old_title = '''              Text(
                title,
                style: const TextStyle('''
          new_title = '''              Text(
                title,
                textAlign: centerTitle ? TextAlign.center : TextAlign.start,
                style: const TextStyle('''
          if sheet.count(old_title) != 1:
              raise SystemExit(f'_SheetFrame title mismatch: {sheet.count(old_title)}')
          sheet = sheet.replace(old_title, new_title)
          text = text[:sheet_start] + sheet + text[sheet_end:]

          # Match the visual identity in the supplied reference: black All Data,
          # blue Milk, handshake Credit and money-bag Salary.
          scopes_start = text.index('const List<_ExportScopeSpec> _exportScopes')
          scopes_end = text.index('\n];', scopes_start) + 3
          scopes = text[scopes_start:scopes_end]
          scope_replacements = [
              ('color: Color(0xFF5E5CE6),', 'color: Color(0xFF111111),'),
              ('icon: Icons.water_drop_rounded,\n    color: appleGreen,', 'icon: Icons.local_drink_rounded,\n    color: appleBlue,'),
              ('icon: Icons.account_balance_wallet_rounded,', 'icon: Icons.handshake_rounded,'),
              ('icon: Icons.currency_rupee_rounded,', 'icon: Icons.savings_rounded,'),
          ]
          for old, new in scope_replacements:
              if scopes.count(old) != 1:
                  raise SystemExit(f'Export scope identity mismatch for {old!r}: {scopes.count(old)}')
              scopes = scopes.replace(old, new)
          text = text[:scopes_start] + scopes + text[scopes_end:]

          export_start = text.index('class _ExportCenterSheetState extends State<_ExportCenterSheet> {')
          export_end = text.index('\nclass _ExportDataset {', export_start)
          replacement = r'''class _ExportCenterSheetState extends State<_ExportCenterSheet> {
  _ExportFormat _format = _ExportFormat.pdf;

  @override
  Widget build(BuildContext context) {
    final bool dark = Theme.of(context).brightness == Brightness.dark;
    return _SheetFrame(
      title: 'Export Center',
      centerTitle: true,
      children: <Widget>[
        Text(
          'CHOOSE FORMAT, THEN SELECT REPORT',
          textAlign: TextAlign.center,
          style: TextStyle(
            color: dark ? Colors.white.withAlpha(145) : const Color(0xFF6B7280),
            fontSize: 12,
            fontWeight: FontWeight.w900,
            letterSpacing: 1.05,
          ),
        ),
        const SizedBox(height: 18),
        Container(
          padding: const EdgeInsets.all(10),
          decoration: BoxDecoration(
            color: dark ? Colors.white.withAlpha(14) : Colors.black.withAlpha(10),
            borderRadius: BorderRadius.circular(24),
            border: Border.all(
              color: dark
                  ? Colors.white.withAlpha(24)
                  : Colors.black.withAlpha(18),
            ),
          ),
          child: Column(
            children: <Widget>[
              Row(
                children: <Widget>[
                  Expanded(
                    child: _formatButton(
                      _ExportFormat.pdf,
                      'Premium PDF',
                      Icons.picture_as_pdf_rounded,
                      const <Color>[
                        Color(0xFF0787FF),
                        Color(0xFF5856D6),
                      ],
                    ),
                  ),
                  const SizedBox(width: 10),
                  Expanded(
                    child: _formatButton(
                      _ExportFormat.csv,
                      'CSV Backup',
                      Icons.table_view_rounded,
                      const <Color>[
                        Color(0xFF34C759),
                        Color(0xFF20B85A),
                      ],
                    ),
                  ),
                ],
              ),
              const SizedBox(height: 10),
              Row(
                children: <Widget>[
                  Expanded(
                    child: _formatButton(
                      _ExportFormat.aiLedger,
                      'AI Ledger',
                      Icons.smart_toy_rounded,
                      const <Color>[
                        Color(0xFF9A67EA),
                        Color(0xFF7057D9),
                      ],
                    ),
                  ),
                  const SizedBox(width: 10),
                  const Expanded(child: SizedBox(height: 72)),
                ],
              ),
            ],
          ),
        ),
        const SizedBox(height: 14),
        AnimatedSwitcher(
          duration: const Duration(milliseconds: 180),
          switchInCurve: Curves.easeOutCubic,
          switchOutCurve: Curves.easeInCubic,
          child: Text(
            _formatHint(),
            key: ValueKey<_ExportFormat>(_format),
            textAlign: TextAlign.center,
            style: TextStyle(
              color: dark
                  ? Colors.white.withAlpha(135)
                  : systemGray.withAlpha(220),
              fontSize: 12.5,
              height: 1.35,
              fontWeight: FontWeight.w800,
            ),
          ),
        ),
        const SizedBox(height: 22),
        _scopePair(_exportScopes[0], _exportScopes[1]),
        const SizedBox(height: 12),
        _scopePair(_exportScopes[2], _exportScopes[3]),
        const SizedBox(height: 12),
        _scopePair(_exportScopes[4], _exportScopes[5]),
        const SizedBox(height: 12),
        _scopeButton(_exportScopes[6], wide: true),
      ],
    );
  }

  Widget _formatButton(
    _ExportFormat format,
    String label,
    IconData icon,
    List<Color> activeColors,
  ) {
    final bool selected = _format == format;
    final bool dark = Theme.of(context).brightness == Brightness.dark;
    final Color idleColor =
        dark ? Colors.white.withAlpha(175) : systemGray.withAlpha(235);
    return _Pressable(
      semanticLabel: 'Select $label export format',
      onTap: () {
        HapticFeedback.selectionClick();
        if (_format != format) setState(() => _format = format);
      },
      borderRadius: BorderRadius.circular(18),
      child: AnimatedContainer(
        duration: const Duration(milliseconds: 220),
        curve: const Cubic(0.2, 0.8, 0.2, 1),
        height: 72,
        padding: const EdgeInsets.symmetric(horizontal: 12),
        decoration: BoxDecoration(
          color: selected ? null : Colors.transparent,
          gradient: selected
              ? LinearGradient(
                  begin: Alignment.topLeft,
                  end: Alignment.bottomRight,
                  colors: activeColors,
                )
              : null,
          borderRadius: BorderRadius.circular(18),
          border: Border.all(
            color: selected
                ? Colors.white.withAlpha(dark ? 42 : 92)
                : Colors.transparent,
          ),
          boxShadow: selected
              ? <BoxShadow>[
                  BoxShadow(
                    color: activeColors.last.withAlpha(dark ? 62 : 82),
                    blurRadius: 20,
                    offset: const Offset(0, 8),
                  ),
                ]
              : const <BoxShadow>[],
        ),
        child: Row(
          mainAxisAlignment: MainAxisAlignment.center,
          children: <Widget>[
            Icon(
              icon,
              color: selected ? Colors.white : idleColor,
              size: 23,
            ),
            const SizedBox(width: 9),
            Flexible(
              child: Text(
                label,
                maxLines: 1,
                softWrap: false,
                overflow: TextOverflow.fade,
                style: TextStyle(
                  color: selected ? Colors.white : idleColor,
                  fontSize: 15.5,
                  fontWeight: FontWeight.w900,
                  letterSpacing: -.15,
                ),
              ),
            ),
          ],
        ),
      ),
    );
  }

  Widget _scopePair(_ExportScopeSpec left, _ExportScopeSpec right) => Row(
        children: <Widget>[
          Expanded(child: _scopeButton(left)),
          const SizedBox(width: 12),
          Expanded(child: _scopeButton(right)),
        ],
      );

  Widget _scopeButton(_ExportScopeSpec spec, {bool wide = false}) {
    final bool dark = Theme.of(context).brightness == Brightness.dark;
    final List<Color> colors = _scopeGradient(spec, dark);
    return _Pressable(
      semanticLabel: 'Export ${spec.label}',
      onTap: () => Navigator.pop(
        context,
        _ExportChoice(_format, spec.scope),
      ),
      borderRadius: BorderRadius.circular(22),
      child: Container(
        width: double.infinity,
        height: wide ? 76 : 72,
        padding: EdgeInsets.symmetric(horizontal: wide ? 22 : 14),
        decoration: BoxDecoration(
          gradient: LinearGradient(
            begin: Alignment.topLeft,
            end: Alignment.bottomRight,
            colors: colors,
          ),
          borderRadius: BorderRadius.circular(22),
          border: Border.all(
            color: Colors.white.withAlpha(dark ? 24 : 78),
          ),
          boxShadow: <BoxShadow>[
            BoxShadow(
              color: spec.color.withAlpha(dark ? 34 : 58),
              blurRadius: 22,
              offset: const Offset(0, 9),
            ),
          ],
        ),
        child: Row(
          mainAxisAlignment: MainAxisAlignment.center,
          children: <Widget>[
            Icon(spec.icon, size: wide ? 25 : 23, color: Colors.white),
            const SizedBox(width: 9),
            Flexible(
              child: Text(
                spec.label,
                maxLines: 1,
                softWrap: false,
                overflow: TextOverflow.fade,
                style: TextStyle(
                  color: Colors.white,
                  fontSize: wide ? 19 : 16,
                  fontWeight: FontWeight.w900,
                  letterSpacing: -.2,
                ),
              ),
            ),
          ],
        ),
      ),
    );
  }

  String _formatHint() => switch (_format) {
        _ExportFormat.pdf =>
          'Premium PDF app ke current colors, borders, cards aur dark/light mode se banegi.',
        _ExportFormat.csv =>
          'CSV Backup clean spreadsheet-ready data ke saath banega.',
        _ExportFormat.aiLedger =>
          'AI Ledger AI-readable structured format me complete ledger banayega.',
      };

  List<Color> _scopeGradient(_ExportScopeSpec spec, bool dark) =>
      switch (spec.scope) {
        _ExportScope.all => dark
            ? const <Color>[Color(0xFF3A3A3C), Color(0xFF111111)]
            : <Color>[spec.color, const Color(0xFF000000)],
        _ExportScope.milk =>
          <Color>[const Color(0xFF2BA8FF), spec.color],
        _ExportScope.expenses =>
          <Color>[const Color(0xFFFF554C), spec.color],
        _ExportScope.credit =>
          <Color>[const Color(0xFFFFBC45), spec.color],
        _ExportScope.salary =>
          <Color>[const Color(0xFF35D46D), spec.color],
        _ExportScope.diary =>
          <Color>[const Color(0xFFA1A1A6), spec.color],
        _ExportScope.business =>
          <Color>[spec.color, const Color(0xFF8E62D9)],
      };
}
'''
          text = text[:export_start] + replacement.rstrip() + '\n' + text[export_end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format
        run: dart format lib/main.dart

      - name: Analyze
        run: flutter analyze

      - name: Test ledger invariants
        run: flutter test

      - name: Commit and push verified UI
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Upgrade Export Center premium UI"
          git push origin HEAD:main
