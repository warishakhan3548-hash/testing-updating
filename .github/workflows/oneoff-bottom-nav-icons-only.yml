name: One-off Bottom Nav Icons Only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-bottom-nav-icons-only.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply bottom-nav-only patch
        run: python3 .github/patch_bottom_nav_icons_only.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format
        run: dart format lib/main.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Guard diff scope
        run: |
          git diff -- lib/main.dart > /tmp/nav.diff
          python3 - <<'PY'
          from pathlib import Path
          d = Path('/tmp/nav.diff').read_text()
          forbidden = [
              'DashboardScreen',
              'class _MetricCard',
              'class _GlassCard',
              'class _CardAccentPainter',
              'class BusinessScreen',
              'class CreditScreen',
          ]
          for item in forbidden:
              if item in d:
                  raise SystemExit(f'Forbidden non-nav scope touched: {item}')
          if '_BottomNavModuleIcon' not in d:
              raise SystemExit('Expected bottom-nav icon patch missing')
          PY

      - name: Commit verified icon-only change
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Replace bottom module icons only [skip ci]
          file_pattern: lib/main.dart
