name: Interaction Fluidity Surgeon V6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/interaction-fluidity-surgeon-v6.yml"
      - ".github/interaction_patch_v6.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch velocity-coupled press physics
        run: python3 .github/interaction_patch_v6.py

      - name: Remove temporary surgeon
        run: rm .github/workflows/interaction-fluidity-surgeon-v6.yml .github/interaction_patch_v6.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format surgical patch
        run: dart format --language-version latest lib/main.dart test/ui_micro_aesthetics_test.dart

      - name: Verify formatting
        run: dart format --language-version latest --output=none --set-exit-if-changed lib/main.dart test/ui_micro_aesthetics_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Stage and validate diff
        shell: bash
        run: |
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/interaction_patch_v6.py' '.github/workflows/interaction-fluidity-surgeon-v6.yml' 'lib/main.dart' 'test/ui_micro_aesthetics_test.dart' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected staged files:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          git diff --cached --stat

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ui: add velocity-coupled press physics"
          git push origin HEAD:main
