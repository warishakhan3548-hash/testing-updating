name: Quick Expense Share Icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/quick-expense-share-icon.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch expense share action only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = """            _SoftShareButton(\n              compact: true,\n              icon: Icons.share_rounded,\n              color: appleBlue,\n              semanticLabel: 'Share this month expenses',\n              onTap: () => unawaited(_shareCurrentMonthExpenses()),\n            ),"""
          new = """            _CircleAction(\n              icon: Icons.share_rounded,\n              color: appleBlue,\n              semanticLabel: 'Share this month expenses',\n              onTap: () => unawaited(_shareCurrentMonthExpenses()),\n            ),"""
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one expense share block, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- lib/main.dart
      - name: Commit exact UI change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "ui: use icon-only expense share action"
          git push origin HEAD:main
