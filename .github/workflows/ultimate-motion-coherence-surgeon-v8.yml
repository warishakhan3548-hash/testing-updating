name: Ultimate Motion Coherence Surgeon V8

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ultimate-motion-coherence-surgeon-v8.yml"

permissions:
  contents: write

concurrency:
  group: ultimate-motion-coherence-surgeon-v8-main
  cancel-in-progress: false

jobs:
  patch-analyze-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Apply zero-wrapper kinetic coherence upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/main.dart')
          source = path.read_text(encoding='utf-8')
          before = source

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              source = source.replace(old, new, 1)

          visual_tokens = (
              'static const double cardRadius = 24;',
              'static const double heroRadius = 28;',
              'static const double sheetRadius = 36;',
              'const IconData premiumHomeIcon = Icons.space_dashboard_rounded;',
              'const IconData premiumExpenseIcon = Icons.shopping_bag_rounded;',
              'const IconData premiumDeleteIcon = Icons.delete_outline_rounded;',
              'Color(0xFAFFFFFF), Color(0xF2FFFFFF)',
              'Color(0xF0121826), Color(0xE3080C18)',
              'width: 84,',
              'height: 70,',
              'height: 88,',
              '..setEntry(3, 2, .00075)',
              '..rotateY(-delta * .018)',
              'offset: Offset(0, depth * 1.8)',
              '..setEntry(3, 2, .0013)',
              'offset: Offset(0, motion * 1.30)',
              'scale: 1 - (motion * .017)',
          )
          visual_before = {token: source.count(token) for token in visual_tokens}

          replace_once(
              '  static const double _flingCommitPagesPerSecond = .52;\n',
              '  static const double _flingCommitPagesPerSecond = .52;\n'
              '  // Target selection keeps full gesture intent while spring energy is\n'
              '  // viewport-normalized, preventing extreme flick overshoot.\n'
              '  static const double _maxSettlePagesPerSecond = 3.25;\n',
              'page settle declaration',
          )

          replace_once(
              '    final double targetPixels =\n'
              '        (position.minScrollExtent + clampedPage * pageExtent)\n'
              '            .clamp(position.minScrollExtent, position.maxScrollExtent)\n'
              '            .toDouble();\n\n'
              '    if ((targetPixels - position.pixels).abs() <= tolerance.distance &&\n',
              '    final double targetPixels =\n'
              '        (position.minScrollExtent + clampedPage * pageExtent)\n'
              '            .clamp(position.minScrollExtent, position.maxScrollExtent)\n'
              '            .toDouble();\n'
              '    final double maxSettleVelocity =\n'
              '        pageExtent * _maxSettlePagesPerSecond;\n'
              '    final double settleVelocity = velocity\n'
              '        .clamp(-maxSettleVelocity, maxSettleVelocity)\n'
              '        .toDouble();\n\n'
              '    if ((targetPixels - position.pixels).abs() <= tolerance.distance &&\n',
              'page settle clamp',
          )

          replace_once(
              '      targetPixels,\n      velocity,\n      tolerance: tolerance,\n',
              '      targetPixels,\n      settleVelocity,\n      tolerance: tolerance,\n',
              'page settle simulation',
          )

          replace_once(
              '    final double directionalDot =\n'
              '        _gestureVelocity.dx * sample.dx + _gestureVelocity.dy * sample.dy;\n'
              '    final bool reversing =\n'
              '        previousSpeed > 80 && sampleSpeed > 80 && directionalDot < 0;\n'
              '    final double velocityResponsePerSecond = reversing ? 52 : 32;\n',
              '    final double directionalDot =\n'
              '        _gestureVelocity.dx * sample.dx + _gestureVelocity.dy * sample.dy;\n'
              '    final double directionAgreement = previousSpeed > 0 && sampleSpeed > 0\n'
              '        ? (directionalDot / (previousSpeed * sampleSpeed))\n'
              '            .clamp(-1.0, 1.0)\n'
              '            .toDouble()\n'
              '        : 1;\n'
              '    // Curved movement is not a reversal; only materially opposing\n'
              '    // vectors purge stale momentum from the release estimate.\n'
              '    final bool reversing = previousSpeed > 80 &&\n'
              '        sampleSpeed > 80 &&\n'
              '        directionAgreement < -.20;\n'
              '    final double velocityResponsePerSecond = reversing ? 52 : 32;\n',
              'reversal classification',
          )

          replace_once(
              '    const int freshnessWindowMicros = 160000;\n'
              '    if (ageMicros <= 0) return _gestureVelocity;\n'
              '    if (ageMicros >= freshnessWindowMicros) return Offset.zero;\n'
              '    final double freshness = 1 - (ageMicros / freshnessWindowMicros);\n'
              '    final double easedFreshness = freshness * freshness;\n'
              '    return _gestureVelocity * easedFreshness;\n',
              '    const int freshnessWindowMicros = 160000;\n'
              '    const int minimumFreshnessWindowMicros = 90000;\n'
              '    if (ageMicros <= 0) return _gestureVelocity;\n'
              '    final double speedIntent =\n'
              '        (_gestureVelocity.distance / 1800).clamp(0.0, 1.0).toDouble();\n'
              '    final int adaptiveFreshnessWindowMicros =\n'
              '        (minimumFreshnessWindowMicros +\n'
              '                (freshnessWindowMicros - minimumFreshnessWindowMicros) *\n'
              '                    speedIntent)\n'
              '            .round();\n'
              '    if (ageMicros >= adaptiveFreshnessWindowMicros) return Offset.zero;\n'
              '    final double freshness =\n'
              '        1 - (ageMicros / adaptiveFreshnessWindowMicros);\n'
              '    final double easedFreshness = freshness * freshness;\n'
              '    return _gestureVelocity * easedFreshness;\n',
              'release freshness',
          )

          visual_after = {token: source.count(token) for token in visual_tokens}
          if visual_before != visual_after:
              raise SystemExit('VISUAL LOCK VIOLATION')

          required = (
              'static const double _maxSettlePagesPerSecond = 3.25;',
              'targetPixels,\n      settleVelocity,',
              'final double directionAgreement =',
              'directionAgreement < -.20;',
              'velocityResponsePerSecond = reversing ? 52 : 32;',
              'const int freshnessWindowMicros = 160000;',
              'const int minimumFreshnessWindowMicros = 90000;',
              'adaptiveFreshnessWindowMicros',
              'final double easedFreshness = freshness * freshness;',
          )
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f'MOTION CONTRACT MISSING: {missing}')
          if source == before:
              raise SystemExit('No source changes produced')

          path.write_text(source, encoding='utf-8')
          PY
          rm -f .github/workflows/ultimate-motion-coherence-surgeon-v8.yml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lock stayed untouched
        run: git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Format surgical target
        run: dart format --language-version latest lib/main.dart

      - name: Validate locked scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/ultimate-motion-coherence-surgeon-v8.yml' 'lib/main.dart' | sort)"
          test "$changed" = "$expected"

      - name: Flutter analyze
        run: flutter analyze

      - name: Stage commit and push analyzed upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/ultimate-motion-coherence-surgeon-v8.yml' 'lib/main.dart' | sort)"
          test "$staged" = "$expected"
          git commit -m "perf(ui): harden kinetic motion coherence [skip ci]"
          git push origin HEAD:main
