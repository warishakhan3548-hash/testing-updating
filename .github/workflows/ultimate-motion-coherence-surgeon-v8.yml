name: Ultimate Motion Coherence Surgeon V8

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ultimate-motion-coherence-surgeon-v8.yml"

permissions:
  contents: write

concurrency:
  group: ultimate-motion-coherence-surgeon-v8-main
  cancel-in-progress: false

jobs:
  patch-analyze-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Apply zero-wrapper kinetic coherence upgrade
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/ultimate_motion_patch.py
          python3 /tmp/ultimate_motion_patch.py
          rm -f /tmp/ultimate_motion_patch.py
          rm -f .github/workflows/ultimate-motion-coherence-surgeon-v8.yml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lock stayed untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Format surgical target
        run: dart format --language-version latest lib/main.dart

      - name: Validate locked scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/ultimate-motion-coherence-surgeon-v8.yml' 'lib/main.dart' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected changed files:'
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Flutter analyze
        run: flutter analyze

      - name: Stage commit and push analyzed upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/ultimate-motion-coherence-surgeon-v8.yml' 'lib/main.dart' | sort)"
          if [ "$staged" != "$expected" ]; then
            echo 'Unexpected staged files:'
            printf '%s\n' "$staged"
            exit 1
          fi
          git commit -m "perf(ui): harden kinetic motion coherence [skip ci]"
          git push origin HEAD:main
