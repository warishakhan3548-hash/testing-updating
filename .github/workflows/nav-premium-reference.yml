name: Premium Module Navigation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nav-premium-reference.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart')
          s=p.read_text()
          old='''                        decoration: BoxDecoration(\n                          color: active\n                              ? color.withAlpha(dark ? 23 : 14)\n                              : Colors.transparent,\n                          borderRadius: BorderRadius.circular(20),\n                        ),'''
          new='''                        decoration: BoxDecoration(\n                          color: active\n                              ? color.withAlpha(dark ? 44 : 24)\n                              : Colors.transparent,\n                          borderRadius: BorderRadius.circular(20),\n                          border: Border.all(\n                            color: active\n                                ? color.withAlpha(dark ? 54 : 38)\n                                : Colors.transparent,\n                          ),\n                          boxShadow: active\n                              ? <BoxShadow>[\n                                  BoxShadow(\n                                    color: color.withAlpha(dark ? 42 : 26),\n                                    blurRadius: 22,\n                                    offset: const Offset(0, 7),\n                                  ),\n                                ]\n                              : const <BoxShadow>[],\n                        ),'''
          if s.count(old)!=1: raise SystemExit('nav block mismatch')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: dart format lib/main.dart
      - run: flutter analyze
      - run: flutter test
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Align premium module navigation to reference
          file_pattern: lib/main.dart
