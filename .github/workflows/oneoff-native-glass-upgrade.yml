name: One-off Native Glass Upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-native-glass-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply guarded native glass translation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/native_glass_upgrade.py')
          s = p.read_text(encoding='utf-8')
          old = """replace_once(\n    '              boxShadow: AppStyles.glow(context, color),',\n    '              boxShadow: AppStyles.jewelDepth(context, color),',\n    'circle action jewel shadow',\n)"""
          new = """replace_once(\n    \"\"\"              shape: BoxShape.circle,\n              color: color.withAlpha(23),\n              border: Border.fromBorderSide(\n                AppStyles.hairline(context, accent: color, active: true),\n              ),\n              boxShadow: AppStyles.glow(context, color),\"\"\",\n    \"\"\"              shape: BoxShape.circle,\n              color: color.withAlpha(23),\n              border: Border.fromBorderSide(\n                AppStyles.hairline(context, accent: color, active: true),\n              ),\n              boxShadow: AppStyles.jewelDepth(context, color),\"\"\",\n    'circle action jewel shadow',\n)"""
          if old not in s:
              raise SystemExit('workflow hotfix precondition failed')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/native_glass_upgrade.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aarish-diary-debug-keystore-v1

      - name: Resolve packages
        run: flutter pub get

      - name: Format
        run: dart format lib/main.dart

      - name: Analyze
        run: flutter analyze

      - name: Test ledger invariants
        run: flutter test

      - name: Commit verified native glass UI upgrade
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Translate premium web glass physics to native Flutter [skip ci]
          file_pattern: lib/main.dart pubspec.yaml

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aarish-diary-v1.0.4-native-glass-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
