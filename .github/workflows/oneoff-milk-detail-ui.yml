name: One-off Milk Detail Premium UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-milk-detail-ui.yml"

permissions:
  contents: write

jobs:
  migrate-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical Milk detail migration
        run: python3 .github/milk_detail_ui_patch.py

      - name: Remove dead shared hero API after specialization
        run: python3 .github/milk_detail_cleanup_patch.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format migrated source
        run: dart format lib/main.dart

      - name: Analyze
        run: flutter analyze

      - name: Test ledger invariants
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Remove one-off migration machinery
        run: |
          rm -f .github/milk_detail_ui_patch.py
          rm -f .github/milk_detail_cleanup_patch.py
          rm -f .github/workflows/oneoff-milk-detail-ui.yml

      - name: Commit verified production UI
        run: |
          git config user.name "Aarish UI Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Upgrade milk customer detail premium table UI [skip ci]"
          git push origin HEAD:main

# verification retry 3
