name: Compact Dashboard AI Hub

on:
  push:
    paths:
      - '.github/workflows/compact-dashboard-ai-hub.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compact only dashboard AI Hub button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')

          start = text.index('class _AiHubButton extends StatelessWidget {')
          end = text.index('\nclass DashboardScreen extends StatefulWidget {', start)
          block = text[start:end]

          old = '        width: 68,\n        height: 40,'
          new = '        width: 60,\n        height: 40,'
          if block.count(old) != 1:
              raise SystemExit(f'Expected exactly one AI Hub width target, found {block.count(old)}')

          block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Diff sanity check only
        shell: bash
        run: |
          git diff --check
          git diff -- lib/main.dart
          test "$(git diff --numstat -- lib/main.dart | awk '{print $1+$2}')" = "2"
          grep -q "width: 60," lib/main.dart
          grep -q "subtitle: 'AARISH DAIRY'" lib/main.dart

      - name: Commit surgical adjustment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git commit -m 'fix: fit dashboard subtitle beside AI Hub [skip ci]'
          git push origin HEAD:main
