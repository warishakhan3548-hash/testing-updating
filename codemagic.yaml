workflows:
  android-apk:
    name: Voice Ludo Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Android scaffold
        script: |
          set -euo pipefail
          rm -rf /tmp/voice_ludo_android
          flutter create \
            --platforms=android \
            --project-name voice_ludo_masti \
            --org com.aaris \
            /tmp/voice_ludo_android
          rm -rf android
          cp -R /tmp/voice_ludo_android/android ./android

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')

          permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.INTERNET" />',
          ]

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if marker not in text:
              raise SystemExit('Android manifest header not found')

          missing = [p for p in permissions if p not in text]
          if missing:
              text = text.replace(
                  marker,
                  marker + '\n    ' + '\n    '.join(missing),
                  1,
              )

          queries = '''    <queries>
              <intent>
                  <action android:name="android.speech.RecognitionService" />
              </intent>
          </queries>
          '''
          if 'android.speech.RecognitionService' not in text:
              app_marker = '    <application'
              if app_marker not in text:
                  raise SystemExit('Android application node not found')
              text = text.replace(app_marker, queries + app_marker, 1)

          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Build release APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
