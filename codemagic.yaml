workflows:
  android-apk:
    name: Voice Ludo Native Speech APK
    max_build_duration: 60
    environment:
      flutter: 3.47.1
    scripts:
      - name: Verify Android project and native speech bridge
        script: |
          set -euo pipefail
          test -d android
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradle.properties
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/aaris/voiceludomasti/MainActivity.kt
          grep -Fq 'android.builtInKotlin=false' android/gradle.properties
          grep -Fq 'id("org.jetbrains.kotlin.android")' android/app/build.gradle.kts
          grep -Fq 'voice_ludo/speech' android/app/src/main/kotlin/com/aaris/voiceludomasti/MainActivity.kt
          grep -Fq 'voice_ludo/speech_events' android/app/src/main/kotlin/com/aaris/voiceludomasti/MainActivity.kt
          grep -Fq 'SpeechRecognizer.createSpeechRecognizer' android/app/src/main/kotlin/com/aaris/voiceludomasti/MainActivity.kt
          grep -Fq 'android.speech.RecognitionService' android/app/src/main/AndroidManifest.xml
          if grep -Fq 'vosk_flutter_service' pubspec.yaml; then
            echo "ERROR: legacy Vosk dependency must not return."
            exit 1
          fi
          echo "Permanent Android + native system speech bridge: OK"

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Run logic and Android contract tests
        script: flutter test

      - name: Analyze source
        script: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
